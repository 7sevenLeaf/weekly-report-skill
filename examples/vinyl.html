<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个人周报 第19周</title>
<meta name="generator" content="weekly-report skill · 主题：唱片">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@500;700;900&amp;display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
/* 周报套件的骨架样式。颜色、字体、质感都用变量，交给主题定。
   规矩：一个强调色 + 灰阶；正文不小于 15px，说明不小于 13px；数字等宽；不出现横向滚动；不发光。 */
:root{
  --bg:#F3F2EE; --bg2:#E9E7E1; --ink:#1C1C1A; --ink2:#4E4D49; --mute:#86847E; --rule:rgba(28,28,26,.14);
  --accent:#E8552B; --accent-ink:#fff;
  /* 类别：强调色深浅 + 中性灰，不再加新颜色 */
  --c-study:var(--accent); --c-star:var(--ink); --c-sport:color-mix(in oklab,var(--accent) 55%,var(--bg));
  --c-life:color-mix(in oklab,var(--ink) 28%,var(--bg)); --c-sleep:color-mix(in oklab,var(--ink) 12%,var(--bg)); --c-none:transparent;
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:var(--font); --font-say:var(--font); --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --gap:64px; --r:0px;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:clip;font-synthesis:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{max-width:100%}
h1,h2,h3{text-wrap:balance} p{text-wrap:pretty}
#wr{position:relative;max-width:620px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-right,0px)) 80px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--gap);font-variant-numeric:tabular-nums}

.wr-fict{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;padding:3px 12px;font-size:12px;letter-spacing:.06em;background:var(--ink);color:var(--bg);border-radius:99px;pointer-events:none;opacity:.9;white-space:nowrap}
.wr-progress{position:fixed;left:0;right:0;top:0;height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:6;pointer-events:none}

/* 进场：默认可见，只做一次轻微上浮 */
.wr-move .wr-sec{opacity:.001;transform:translateY(18px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.wr-move .wr-sec.wr-in{opacity:1;transform:none}

/* 封面（主题通常会改写） */
.wr-cover{min-height:min(86vh,760px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.wr-kicker{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink2)}
.wr-title{margin:0;font-weight:900;font-size:clamp(76px,25vw,150px);line-height:1;letter-spacing:-.02em}
.wr-name{font-size:18px;font-weight:700}
.wr-cover-nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.wr-cover-nums div{padding:12px 10px 0 0}
.wr-cover-nums div+div{border-left:1px solid var(--rule);padding-left:12px}
.wr-cover-nums b{display:block;font-family:var(--font-num);font-size:clamp(28px,9vw,44px);line-height:1.05}
.wr-cover-nums span{font-size:13px;color:var(--ink2)}

/* 小标题 */
.wr-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.wr-h h2{margin:0;font-size:26px;line-height:1.2;font-weight:900;letter-spacing:-.01em}
.wr-hint{font-size:13px;color:var(--mute)}
.wr-note{font-size:13px;color:var(--mute);margin:10px 0 0;line-height:1.65}

/* 切换按钮 */
.wr-tabs{display:flex;gap:6px;flex-wrap:wrap}
.wr-tab{all:unset;cursor:pointer;padding:7px 14px;border:1px solid var(--rule);border-radius:99px;font-size:14px;font-weight:700;color:var(--ink2);transition:background .2s var(--ease),color .2s var(--ease),border-color .2s}
.wr-tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wr-tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wr-tab:active{transform:scale(.97)}

/* 核心数据 */
.wr-big{font-family:var(--font-num);font-weight:900;font-size:clamp(84px,27vw,150px);line-height:.95;margin-top:20px;letter-spacing:-.03em;color:var(--ink)}
.wr-cmp{margin:8px 0 0;font-size:15px;color:var(--ink2)}
.wr-cmp b{color:var(--ink)}
.wr-bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;align-items:end;margin-top:24px;border-bottom:1px solid var(--ink)}
.wr-bar{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.wr-bar b{font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink2)}
.wr-bar i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:2px 2px 0 0;transition:height .8s var(--ease),opacity .2s}
.wr-bar i.wr-zero{background:var(--rule)}
.wr-bar.on i{opacity:.55}
.wr-bar.on b{color:var(--accent)}
.wr-goal{position:absolute;left:0;right:0;border-top:1px dashed var(--ink2);transition:bottom .6s var(--ease);pointer-events:none}
.wr-goal span{position:absolute;left:0;top:-20px;font-size:12px;color:var(--ink2);background:var(--bg);padding-right:6px}
.wr-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-weight:700;font-size:13px;margin-top:6px;color:var(--ink2)}

/* 时间花在哪 */
.wr-stack{display:flex;height:44px;gap:2px}
.wr-seg{all:unset;cursor:pointer;flex-basis:0;min-width:3px;transform-origin:0 50%;transition:opacity .2s}
.wr-seg.off{opacity:.25}
.wr-legend{display:flex;flex-direction:column;margin-top:14px}
.wr-li{all:unset;cursor:pointer;display:grid;grid-template-columns:18px 1fr auto 46px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px;transition:opacity .2s}
.wr-li b{font-weight:700} .wr-li em{font-style:normal;color:var(--mute);text-align:right;font-size:13px}
.wr-li.off{opacity:.45}
.wr-mini{margin-top:16px;min-height:96px}
.wr-mbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px}
.wr-mbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%}
.wr-mbars i{display:block;width:100%;max-width:22px;border-radius:2px 2px 0 0;transform-origin:50% 100%}
.wr-mbars b{font-size:11px;color:var(--ink2);white-space:nowrap}
.wr-mbars span{font-size:12px;font-weight:700;color:var(--mute)}

/* 成就 */
.wr-alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wr-a{padding:26px 0;border-bottom:1px solid var(--rule)}
.wr-a:first-child{padding-top:4px}
.wr-a-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline}
.wr-rank{font-family:var(--mono);font-size:13px;color:var(--mute)}
.wr-a-big{font-family:var(--font-num);font-weight:900;font-size:clamp(40px,12vw,64px);line-height:1;letter-spacing:-.02em;color:var(--ink)}
.wr-a-what{font-weight:700;font-size:17px;margin-top:8px}
.wr-a-what span{font-weight:400;color:var(--ink2);font-size:15px}
.wr-fig{margin:18px 0 0;padding:16px;background:var(--bg2);border-radius:var(--r);cursor:pointer}
.wr-fig svg{display:block;width:100%;height:auto;overflow:visible}
.wr-fig text{font-family:var(--font);font-size:11px;fill:var(--ink)}
.wr-a-detail{margin:14px 0 0;font-size:16px}
.wr-say{margin:8px 0 0;font-family:var(--font-say);font-size:16px;font-weight:700;color:var(--ink);line-height:1.6;padding-left:12px;border-left:2px solid var(--accent)}

/* 时间线 */
.wr-now{display:flex;align-items:baseline;gap:12px;min-height:40px;margin-bottom:10px}
.wr-now b{font-family:var(--font-num);font-size:26px;font-weight:900;white-space:nowrap}
.wr-now span{font-size:15px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-tl{position:relative;display:flex;flex-direction:column;gap:5px;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.wr-row{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.wr-row b{font-size:13px;color:var(--mute)}
.wr-row.on b{color:var(--ink)}
.wr-track{position:relative;display:block;height:24px;background:var(--bg2);border-radius:var(--r);overflow:hidden}
.wr-row.on .wr-track{box-shadow:inset 0 0 0 1px var(--ink)}
.wr-blk{position:absolute;top:3px;bottom:3px;border-radius:2px;transform-origin:0 50%}
.wr-cursor{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;transition:left .08s linear}
.wr-axis{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:11px;color:var(--mute);margin-top:6px}
.wr-axis div{display:flex;justify-content:space-between}
.wr-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:12px}
.wr-key span{display:inline-flex;align-items:center;gap:6px}
.wr-dayd{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);min-height:150px}
.wr-dayd h3{margin:0 0 8px;font-size:17px}
.wr-dayd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.wr-dayd li{display:grid;grid-template-columns:22px 92px 1fr;gap:6px;font-size:15px;align-items:start;padding:4px 6px;margin:0 -6px;border-radius:4px;transition:background .2s}
.wr-dayd li.on{background:var(--bg2)}
.wr-dayd li em{font-style:normal;color:var(--ink2);line-height:1.4}
.wr-dayd li em svg{width:18px;height:18px;vertical-align:-4px}
.wr-dayd li span:nth-child(2){font-size:13px;color:var(--mute);padding-top:2px}
.wr-glyph{font-family:"Times New Roman",Times,serif;font-size:17px}

/* 专注时段 7×24 */
.wr-heat{display:grid;grid-template-columns:22px repeat(24,1fr);gap:2px;align-items:center}
.wr-heat b{font-size:12px;color:var(--mute);font-weight:700}
.wr-cell{all:unset;cursor:pointer;aspect-ratio:1;border-radius:2px;background:color-mix(in oklab,var(--accent) calc(var(--a)*100%),var(--bg2))}
.wr-cell.on{outline:2px solid var(--ink);outline-offset:1px}
.wr-hax{display:grid;grid-template-columns:22px 1fr;gap:2px;font-size:11px;color:var(--mute);margin-top:6px}
.wr-hax div{display:flex;justify-content:space-between}
.wr-hread{font-size:15px;margin:14px 0 0;min-height:26px}

/* 目标 */
.wr-goals{display:flex;flex-direction:column}
.wr-g{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:16px 0;border-bottom:1px solid var(--rule)}
.wr-g-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wr-g-n{display:block;font-weight:700;font-size:17px}
.wr-g-r{display:block;font-size:14px;color:var(--ink2)}
.wr-stamp{flex:none;font-weight:700;font-size:12px;padding:2px 10px;border:1px solid currentColor;border-radius:99px;color:var(--ink2)}
.wr-g[data-s="done"] .wr-stamp{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.wr-g[data-s="missed"] .wr-stamp{color:var(--mute)}
.wr-g-bar{display:block;height:4px;margin-top:12px;background:var(--bg2);border-radius:2px;overflow:hidden}
.wr-g-bar i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--ink);border-radius:2px;transform-origin:0 50%}
.wr-g[data-s="done"] .wr-g-bar i{background:var(--accent)}
.wr-move .wr-s-goals:not(.wr-in) .wr-g-bar i{transform:scaleX(0)}
.wr-move .wr-g-bar i{transition:transform 1s var(--ease) .2s}
.wr-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.wr-more>span{overflow:hidden}
[aria-expanded="true"]>.wr-more{grid-template-rows:1fr}
.wr-g-p{display:block;margin-top:8px;font-size:15px}

/* 起伏 */
.wr-curve{position:relative}
.wr-curve svg{display:block;width:100%;height:auto;overflow:visible}
.wr-grid{stroke:var(--rule);stroke-width:1}
.wr-area{fill:var(--accent);opacity:.08;stroke:none}
.wr-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.wr-pt{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.wr-pt.on{fill:var(--accent)}
.wr-gap{font-size:22px;fill:var(--mute)}
.wr-hit{all:unset;position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;cursor:pointer}
.wr-hit:focus-visible{outline:2px solid var(--accent)}
.wr-mdays span.on{color:var(--accent)}
.wr-read{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);min-height:160px}
.wr-who{font-size:13px;color:var(--mute)}
.wr-her{font-weight:900;font-size:clamp(21px,6vw,27px);line-height:1.45;margin:2px 0 12px}
.wr-mine{font-family:var(--font-say);font-size:16px;line-height:1.7;color:var(--ink)}

/* 话 */
.wr-q{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer}
.wr-q-t{display:block;font-weight:900;font-size:clamp(26px,7.4vw,36px);line-height:1.45;min-height:4.4em;letter-spacing:-.01em}
.wr-q-m{display:block;font-size:14px;color:var(--ink2);margin-top:10px;min-height:22px}
.wr-q-n{display:block;font-size:13px;color:var(--mute);margin-top:12px;text-align:right}

/* 复盘 */
.wr-rlist{margin:16px 0 0;padding:0;list-style:none;counter-reset:r}
.wr-rlist li{counter-increment:r;display:grid;grid-template-columns:36px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px}
.wr-rlist li::before{content:counter(r,decimal-leading-zero);font-family:var(--mono);font-size:13px;color:var(--mute);padding-top:4px}

/* 信 */
.wr-letter p{margin:0 0 14px;font-family:var(--font-say);font-size:17px;line-height:1.85}
.wr-letter .wr-sign{text-align:right;font-weight:900;margin:0}

.wr-foot{text-align:center;font-size:13px;color:var(--mute)}
.wr-foot p{margin:4px 0}

/* 类别色块：放在最后，免得被按钮的 all:unset 冲掉 */
.wr-c-study{background:var(--c-study)} .wr-c-sport{background:var(--c-sport)} .wr-c-life{background:var(--c-life)} .wr-c-star{background:var(--c-star)}
.wr-c-sleep{background:var(--c-sleep)} .wr-c-none{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.wr-sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}


@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ====== 第八版：所有主题共享的升级 ====== */
/* 原话：暖色纸卡，文雅的字，下面一句走心的评价；左右滑 */
.wr-qtrack{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;scrollbar-width:none}
.wr-qtrack::-webkit-scrollbar{display:none}
.wr-qcard{position:relative;flex:0 0 86%;margin:0;scroll-snap-align:center;border-radius:var(--qr,22px);padding:24px 20px 18px;
  background:linear-gradient(150deg,var(--q1,#FFF7EC),var(--q2,#FCE6DD));color:var(--qink,#3B2A22);box-shadow:0 10px 28px rgba(120,70,40,.10),inset 0 1px 0 rgba(255,255,255,.8);overflow:hidden}
.wr-qcard::before{content:"“";position:absolute;left:12px;top:-18px;font-family:Georgia,serif;font-size:110px;line-height:1;color:var(--qmark,#F2A27E);opacity:.35}
.wr-qdeco{position:absolute;right:14px;top:14px;width:26px;height:26px;fill:var(--qmark,#F2A27E);opacity:.55}
.wr-qcard .wr-q-t{display:block;margin:0;padding-top:12px;font-family:var(--font-quote,"LXGW WenKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif);font-weight:400;letter-spacing:.02em;font-size:clamp(22px,6.4vw,28px);line-height:1.55;color:inherit;min-height:0;background:none}
.wr-qcard .wr-q-m{display:block;margin-top:10px;font-size:13px;opacity:.7}
.wr-q-note{font-family:"LXGW WenKai",var(--font);margin:14px 0 0;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.55);font-size:14px;line-height:1.65}
.wr-q-note b{color:var(--qmark,#E07A55);font-weight:700}
.wr-qdots{display:flex;gap:6px;justify-content:center}
.wr-qdots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.18);cursor:pointer;transition:width .3s,background .3s}
.wr-qdots i.on{width:18px;background:var(--accent)}
/* 信：按方面分段 */
.wr-lsec{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.wr-ltag{display:inline-block;font-family:var(--font);font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap;margin-top:3px}
/* 目标：百分比 */
.wr-g-pct{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--ink2);margin-top:4px;text-align:right;font-variant-numeric:tabular-nums}
.wr-move .wr-g-bar i{transition:transform 1.2s var(--ease) .15s}
/* 168 小时大环图 */
.wr-donut{display:grid;place-items:center;margin-bottom:6px}
.wr-donut svg{width:200px;height:200px;overflow:visible}
.wr-dseg{cursor:pointer;transition:opacity .25s}
.wr-dseg.off{opacity:.22}
.wr-dc1{font-size:13px;fill:var(--ink2)} .wr-dc2{font-size:26px;font-weight:800;fill:var(--ink);font-family:var(--font-num)}
.wr-dc-study{stroke:var(--c-study)} .wr-dc-sport{stroke:var(--c-sport)} .wr-dc-life{stroke:var(--c-life)} .wr-dc-star{stroke:var(--c-star)} .wr-dc-sleep{stroke:var(--c-sleep)} .wr-dc-none{stroke:var(--rule)}

/* —— 主题：唱片 —— */
/* 唱片（第二版）：一周压成一张唱片。孔版印刷三色（钴蓝、荧光粉、明黄）印在浅色纸上。
   第一版打 8 分，扣在「动效少」：这版加了能点的唱片圈、调音台（时间花在哪）、播放一天的唱针、均衡器式的柱子。 */
:root{
  --bg:#EEF0E8; --bg2:#E2E5DA; --ink:#14163A; --ink2:#4A4D72; --mute:#7C7F9A; --rule:rgba(20,22,58,.16);
  --accent:#FF4F8B; --accent-ink:#14163A; --blue:#2B3BD9; --yellow:#FFC400; --sky:#8FA2FF; --disc:#101230;
  --c-study:var(--accent); --c-sport:var(--yellow); --c-sleep:var(--sky); --c-life:var(--blue); --c-star:var(--ink);
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Anton","Impact","Arial Narrow",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --gap:60px;
}
body{background-image:radial-gradient(var(--bg2) 1.2px,transparent 1.3px);background-size:9px 9px;font-weight:500}
.wr-progress{height:4px}

/* 封面：封套 + 唱片，三圈可以点 */
.vn-cover{display:flex;flex-direction:column;gap:14px}
.vn-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink2)}
.vn-sw{--S:min(74vw,300px);position:relative;width:var(--S);height:calc(var(--S)*1.72);margin:6px auto 0}
.vn-sleeve{position:absolute;inset:0 0 auto 0;height:var(--S);background:var(--blue);z-index:2;overflow:hidden;transform:rotate(-2deg);box-shadow:7px 7px 0 var(--ink);color:#fff}
.wr-move .vn-sleeve{animation:vn-drop .9s var(--ease) both}
@keyframes vn-drop{from{transform:translateY(-40px) rotate(-9deg);opacity:0}}
.vn-sleeve::before{content:"";position:absolute;right:-22%;top:-18%;width:78%;aspect-ratio:1;border-radius:50%;background:var(--yellow)}
.vn-sleeve::after{content:"";position:absolute;left:-30%;bottom:22%;width:170%;height:20%;background:var(--accent);transform:rotate(-24deg)}
.vn-dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.28) 1.4px,transparent 1.5px);background-size:8px 8px;z-index:1}
.vn-sleeve>*:not(.vn-dots){position:absolute;z-index:2}
.vn-vol{left:7%;top:5%;font-family:var(--font-num);font-size:calc(var(--S)*.14);line-height:1}
.vn-sleeve h1{left:7%;bottom:15%;margin:0;font-weight:900;font-size:calc(var(--S)*.215);line-height:1.05;text-shadow:3px 3px 0 var(--ink)}
.vn-cr{left:7%;right:7%;bottom:6%;font-family:var(--mono);font-size:10px;letter-spacing:.06em;display:flex;justify-content:space-between}
.vn-disc{position:absolute;left:3%;top:calc(var(--S)*.56);width:94%;aspect-ratio:1;z-index:1;will-change:transform}
.vn-disc svg{display:block;width:100%;height:100%;filter:drop-shadow(5px 6px 0 rgba(20,22,58,.25))}
.vn-arc{fill:none;stroke-linecap:round;stroke-width:11;transition:stroke-width .2s}
.wr-move .vn-arc{transition:stroke-dashoffset 1.6s var(--ease),stroke-width .2s}
.vn-ring{fill:none;stroke:transparent;stroke-width:16;cursor:pointer;pointer-events:stroke}
.vn-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.vn-legend button{all:unset;cursor:pointer;border:3px solid var(--ink);padding:8px 6px;text-align:center;background:var(--bg);transition:transform .15s,box-shadow .15s}
.vn-legend button:active,.vn-legend button.on{transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--ink)}
.vn-legend b{display:block;font-family:var(--font-num);font-weight:400;font-size:clamp(26px,8vw,36px);line-height:1.05;color:var(--ink);text-shadow:3px 3px 0 var(--c)}
.vn-legend span{font-size:13px;font-weight:700}

/* 标题 */
.wr-h{border-bottom:3px solid var(--ink)}
.wr-h h2{font-size:30px}
.wr-hint{font-family:var(--mono);font-size:12px;letter-spacing:.02em}

/* 试听：均衡器 */
.wr-tab{border:3px solid var(--ink);border-radius:0;color:var(--ink);font-weight:900;transition:transform .15s,box-shadow .15s,background .2s}
.wr-tab[aria-pressed="true"]{background:var(--accent);color:var(--ink);transform:translate(-3px,-3px);box-shadow:3px 3px 0 var(--ink)}
.wr-big{font-weight:400;text-shadow:5px 5px 0 var(--accent)}
.wr-bars{border-bottom:3px solid var(--ink)}
.wr-bar b{font-family:var(--mono);font-weight:500}
.wr-bar i{max-width:34px;background:var(--accent);border:3px solid var(--ink);border-bottom:0;border-radius:0;transform-origin:50% 100%}
.wr-bar i.wr-zero{border-color:var(--rule);background:transparent}
.wr-bar.on i{opacity:1;background:var(--yellow)}

/* 调音台：时间花在哪 */
.vn-mixer{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-top:4px}
.vn-ch{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.vn-slot{position:relative;width:12px;height:170px;background:var(--ink);border-radius:6px}
.vn-fill{position:absolute;left:0;right:0;bottom:0;border-radius:6px;background:var(--c)}
.vn-knob{position:absolute;left:50%;width:38px;height:18px;margin:0 0 -9px -19px;background:var(--bg);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink)}
.vn-knob::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;margin-top:-1px;background:var(--ink)}
.vn-ch b{font-family:var(--font-num);font-weight:400;font-size:20px;line-height:1}
.vn-ch span{font-size:12px;font-weight:700}
.vn-ch.off{opacity:.4}
.wr-s-split .wr-stack,.wr-s-split .wr-legend{display:none}
.wr-mbars i{border:2px solid var(--ink);border-bottom:0;border-radius:0}

/* 主打歌：排名空心大字，左右交替滑入 */
.wr-rank{font-family:var(--font-num);font-size:clamp(60px,18vw,96px);line-height:.9;color:transparent;-webkit-text-stroke:2.5px var(--ink)}
.wr-a-top{align-items:center}
.wr-a:nth-child(even) .wr-a-top{grid-template-columns:1fr auto;text-align:right}
.wr-a:nth-child(even) .wr-rank{order:2}
.wr-a-big{font-weight:400;text-shadow:4px 4px 0 var(--accent);letter-spacing:.01em}
.wr-a:nth-child(3n+2) .wr-a-big{text-shadow:4px 4px 0 var(--yellow)}
.wr-a:nth-child(3n) .wr-a-big{text-shadow:4px 4px 0 var(--sky)}
.wr-move .wr-a .wr-a-top{transition:transform .8s var(--ease),opacity .6s}
.wr-move .wr-a:not(.wr-in) .wr-a-top{transform:translateX(-60px) rotate(-2deg);opacity:0}
.wr-move .wr-a:nth-child(even):not(.wr-in) .wr-a-top{transform:translateX(60px) rotate(2deg)}
.wr-fig{background:var(--ink);border-radius:0}
.wr-fig text{fill:var(--bg)}
.wr-say{border-left:0;padding-left:0;color:var(--blue);font-weight:900}

/* 曲目：时间线 + 唱针 */
.wr-track{background:var(--ink);border-radius:0}
.wr-row.on .wr-track{box-shadow:4px 4px 0 var(--accent)}
.wr-cursor{background:var(--yellow);width:3px}
.wr-now{align-items:center}
.vn-play{all:unset;cursor:pointer;flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--yellow);display:grid;place-items:center;box-shadow:3px 3px 0 var(--accent)}
.vn-play svg{width:18px;height:18px}
.wr-now b{font-family:var(--font-num);font-weight:400;font-size:30px}

/* 制作进度 */
.wr-stamp{border-width:3px;border-radius:0;letter-spacing:.04em;transform:rotate(-4deg)}
.wr-g:nth-child(even) .wr-stamp{transform:rotate(3deg)}
.wr-g[data-s="done"] .wr-stamp{background:transparent;color:var(--blue);border-color:var(--blue)}
.wr-g-bar{height:8px;background:transparent;border:2px solid var(--ink);border-radius:0}
.wr-g-bar i{background:var(--accent)!important;border-radius:0}

/* 情绪旋律：五线谱 */
.wr-grid{stroke:var(--ink);stroke-width:1.5}
.wr-area{opacity:0}
.wr-line{stroke-width:3}
.wr-pt{fill:var(--ink);stroke:var(--ink)}
.wr-pt.on{fill:var(--accent);stroke:var(--accent)}
.wr-mine{color:var(--blue);font-weight:700}

/* 歌词本 */
.wr-q-t{background:linear-gradient(var(--yellow),var(--yellow)) no-repeat 0 92%/100% 38%;display:inline;-webkit-box-decoration-break:clone;box-decoration-break:clone;min-height:0}
.wr-q{min-height:220px}
.wr-q-m{margin-top:16px}

/* 乐评 */
.wr-rlist li::before{font-family:var(--font-num);font-size:26px;color:var(--blue);padding-top:0}

/* 内页附言 */
.wr-letter{background:var(--ink);color:var(--bg);padding:22px 18px;box-shadow:7px 7px 0 var(--accent)}
.wr-letter .wr-sign{color:var(--yellow)}
.wr-foot{font-family:var(--mono);font-size:12px}

/* v8：原话卡像唱片内页的歌词卡，黄色便签 + 粗描边 */
.wr-qcard{--q1:#FFF8D9;--q2:#FFE9A8;--qmark:var(--accent);--qink:var(--ink);--qr:0;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink)}
.wr-q-note{background:#fff;border:2px solid var(--ink);border-radius:0}
.wr-ltag{border-radius:0;background:var(--yellow);color:var(--ink)}
.wr-letter .wr-ltag{color:var(--ink)}

</style>

<script>
window.WR_THEME = {
  splitStyle: "custom",   // 168 小时用推子台
  labels: {
    core: { title: "试听", hint: "点一圈或一个键 · 再点一根柱子" },
    split: { title: "调音台", hint: "168 小时的混音 · 推一推推子" },
    achievements: { title: "本周主打", hint: "top tracks · 点图重放" },
    timeline: { title: "曲目", hint: "▶ 播一天 · 或按住拖" },
    goals: { title: "制作进度", hint: "周初定的目标" },
    mood: { title: "情绪旋律", hint: "点一个音符" },
    quotes: { title: "歌词本", hint: "左右滑，下一句" },
    review: { title: "乐评", hint: "liner notes" },
    letter: { title: "内页附言", hint: "" }
  },
  status: { done: "已发行", partial: "混音中", moved: "改期", missed: "未录" },
  review: { good: "A 面", improve: "B 面", next: "BONUS" },
  cover(c) {
    const m = c.data.meta, core = c.data.core.slice(0, 3);
    const R = [85, 68, 51], COL = ["var(--c-study)", "var(--c-sport)", "var(--c-sleep)"];
    const pct = x => x.goal ? Math.min(1, (x.value || 0) / x.goal) : 1;
    const arcs = core.map((x, i) => { const C = 2 * Math.PI * R[i], off = C * (1 - pct(x) * .985);
      return `<circle cx="100" cy="100" r="${R[i]}" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="11"/><circle class="vn-arc" data-i="${i}" cx="100" cy="100" r="${R[i]}" stroke="${COL[i]}" stroke-dasharray="${C}" stroke-dashoffset="${c.reduce ? off : C}" data-o="${off}"/><circle class="vn-ring" data-i="${i}" cx="100" cy="100" r="${R[i]}"/>`; }).join("");
    const minutes = Math.round((c.data.core.find(x => x.kind === "hours")?.value || 0) * 60);
    return `<header class="vn-cover"><div class="vn-top"><span>${c.esc(m.title)} · 第 ${m.week} 周</span><span>${m.start.replaceAll("-", ".")}—${m.end.slice(5).replace("-", ".")}</span></div>
      <div class="vn-sw"><div class="vn-sleeve"><div class="vn-dots"></div><div class="vn-vol">VOL.${m.week}</div><h1>${c.esc(m.title).replace(/(..)(..)/, "$1<br>$2")}</h1>
        <div class="vn-cr"><span>${c.esc(m.name || "SIDE A / B")}</span><span>7 TRACKS · ${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, "0")}</span></div></div>
        <div class="vn-disc"><svg viewBox="0 0 200 200" role="img" aria-label="唱片上的三圈：${core.map(x => x.label + Math.round(pct(x) * 100) + "%").join("，")}">
          <circle cx="100" cy="100" r="98" fill="var(--disc)"/><g transform="rotate(-90 100 100)">${arcs}</g>
          <circle cx="100" cy="100" r="31" fill="var(--yellow)"/><text x="100" y="98" text-anchor="middle" font-family="Anton,Impact,sans-serif" font-size="26" fill="var(--ink)">${m.week}</text>
          <text x="100" y="112" text-anchor="middle" font-family="DM Mono,monospace" font-size="6" letter-spacing="1" fill="var(--ink)">33⅓ RPM</text><circle cx="100" cy="100" r="2.6" fill="var(--bg)"/></svg></div></div>
      <div class="vn-legend">${core.map((x, i) => `<button data-i="${i}" style="--c:${COL[i]}"><b class="wr-cu" data-v="${x.value ?? ""}" data-k="${x.kind}">${c.fmt(x.value, x.kind)}</b><span>${c.esc(x.label)}</span></button>`).join("")}</div></header>`;
  },
  replay(c) {
    if (c.reduce) return;
    c.$$(".vn-arc").forEach(a => { const C = a.getAttribute("stroke-dasharray"); a.animate([{ strokeDashoffset: C }, { strokeDashoffset: a.dataset.o }], { duration: 1600, easing: "cubic-bezier(.2,.8,.2,1)" }); });
    c.$(".vn-sleeve").animate([{ transform: "translateY(-40px) rotate(-9deg)", opacity: 0 }, { transform: "rotate(-2deg)", opacity: 1 }], { duration: 900, easing: "cubic-bezier(.2,.8,.2,1)" });
  },
  after(c) {
    /* 唱片三圈画出来；点圈或下面的键，跳到「试听」并切到那一项 */
    requestAnimationFrame(() => requestAnimationFrame(() => c.$$(".vn-arc").forEach(a => a.setAttribute("stroke-dashoffset", a.dataset.o))));
    const pick = i => { c.$$(".vn-arc").forEach(a => a.style.strokeWidth = +a.dataset.i === i ? 15 : 11);
      c.$$(".vn-legend button").forEach(b => b.classList.toggle("on", +b.dataset.i === i)); c.showCore && c.showCore(i); };
    c.$$(".vn-ring,.vn-legend button").forEach(b => b.addEventListener("click", () => { pick(+b.dataset.i);
      c.$("#wr-core").scrollIntoView({ behavior: c.reduce ? "auto" : "smooth", block: "start" }); }));
    c.$$("#wr-core .wr-tab").forEach(t => t.addEventListener("click", () => pick(+t.dataset.i)));

    /* 均衡器：柱子进场时先跳几下再落到真实高度 */
    c.onEnter(c.$("#wr-core"), () => { if (c.reduce) return;
      c.$$("#wr-core .wr-bar i").forEach((b, k) => b.animate([{ transform: "scaleY(.1)" }, { transform: "scaleY(1.25)" }, { transform: "scaleY(.7)" }, { transform: "scaleY(1.08)" }, { transform: "none" }],
        { duration: 1100, delay: 250 + k * 70, easing: "ease-out" })); });

    /* 调音台：每一类时间一根推子 */
    const split = c.$("#wr-split");
    if (split) {
      const rows = c.$$(".wr-li", split).map(li => ({ k: li.dataset.k, n: li.children[1].textContent, h: li.children[2].textContent, p: parseInt(li.children[3].textContent) }));
      const mx = Math.max(...rows.map(r => r.p));
      split.querySelector(".wr-h").insertAdjacentHTML("afterend", `<div class="vn-mixer">${rows.map(r => `<button class="vn-ch" data-k="${r.k}" style="--c:var(--c-${r.k === "none" ? "rule" : r.k},var(--rule))" aria-label="${r.n} ${r.h}">
        <span class="vn-slot"><i class="vn-fill" style="height:${r.p / mx * 100}%"></i><i class="vn-knob" style="bottom:${r.p / mx * 100}%"></i></span><b>${r.h}</b><span>${r.n}</span></button>`).join("")}</div>`);
      c.$$(".vn-ch", split).forEach(ch => ch.addEventListener("click", () => { c.$(`.wr-li[data-k="${ch.dataset.k}"]`, split).click();
        c.$$(".vn-ch", split).forEach(x => x.classList.toggle("off", x !== ch)); }));
      c.$$(".vn-ch", split)[0].classList.add("x"); c.$$(".vn-ch", split).forEach((x, i) => x.classList.toggle("off", i !== 0));
      c.onEnter(split, () => { if (c.reduce) return; c.$$(".vn-ch", split).forEach((ch, i) => {
        const b = ch.querySelector(".vn-knob").style.bottom;
        ch.querySelector(".vn-knob").animate([{ bottom: "0%" }, { bottom: b }], { duration: 900, delay: 200 + i * 110, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" });
        ch.querySelector(".vn-fill").animate([{ transform: "scaleY(0)" }, { transform: "none" }], { duration: 900, delay: 200 + i * 110, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }); }); });
      c.$$(".vn-fill", split).forEach(f => f.style.transformOrigin = "50% 100%");
    }

    /* 唱针：▶ 把选中的那一天从 0 点播到 24 点 */
    const tl = c.$("#wr-timeline");
    if (tl && c.setTime) {
      const now = c.$(".wr-now", tl);
      now.insertAdjacentHTML("afterbegin", `<button class="vn-play" aria-label="播放这一天"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></button>`);
      let raf = 0;
      c.$(".vn-play", tl).addEventListener("click", () => { cancelAnimationFrame(raf);
        const day = c.$$(".wr-row", tl).findIndex(r => r.classList.contains("on")), t0 = performance.now(), dur = c.reduce ? 1 : 6000;
        (function step(t) { const p = c.clamp((t - t0) / dur); c.setTime(day, p * 1430); if (p < 1) raf = requestAnimationFrame(step); })(t0); });
    }

    /* 下滑时唱片转 */
    if (c.reduce) return;
    const disc = c.$(".vn-disc"), sw = c.$(".vn-sw"); let spin = 0, last = scrollY;
    (function frame() { spin += .25 + Math.abs(scrollY - last) * .4; last = scrollY; const k = c.clamp(scrollY / 300);
      disc.style.transform = `translateY(${k * sw.offsetWidth * .2}px) rotate(${spin}deg)`; requestAnimationFrame(frame); })();
  }
};

</script>
<script>
/* 周报页面套件：读 <script id="week"> 里的数据，按模块画出页面。
   主题通过 window.WR_THEME 改标题、改封面、加额外模块、在画完后加装饰；样式交给主题的 CSS 变量。
   动效原则：每个动效都在讲数据（数字滚动、柱子长出、线条画出、格子亮起），减少动效时直接给终态。 */
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("week").textContent);
  const T = window.WR_THEME || {};
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const root = document.getElementById("wr");
  const DAYS = ["一", "二", "三", "四", "五", "六", "日"];
  const CATS = [["study", "学习"], ["sport", "运动"], ["life", "个人"], ["star", "高光"], ["sleep", "睡眠"]];
  const CATN = Object.fromEntries(CATS);
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const hm = h => { if (h == null) return "—"; const H = Math.floor(h + 1e-9), M = Math.round((h - H) * 60); return M === 60 ? `${H + 1}h` : H ? (M ? `${H}h${String(M).padStart(2, "0")}` : `${H}h`) : `${M}m`; };
  const fmt = (v, kind) => v == null ? "—" : kind === "count" ? String(Math.round(v)) : hm(v);
  const mins = t => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
  const clock = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  const ease = t => 1 - Math.pow(1 - t, 3);
  document.documentElement.classList.add(reduce ? "wr-still" : "wr-move");

  /* 进场：一个元素第一次进入视野时触发 */
  const enterFns = new WeakMap();
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("wr-in"); io.unobserve(e.target);
    (enterFns.get(e.target) || []).forEach(f => f());
  }), { threshold: .18 });
  const onEnter = (el, fn) => { if (!el) return; if (fn) enterFns.set(el, [...(enterFns.get(el) || []), fn]); io.observe(el); };

  /* 数字滚动 */
  function countUp(el, value, kind, dur = 900) {
    if (value == null) { el.textContent = "—"; return; }
    if (reduce) { el.textContent = fmt(value, kind); return; }
    const t0 = performance.now(), id = (el._cu = (el._cu || 0) + 1);

    $$(".wr-cell", box).forEach(c => c.onclick = () => { const d = +c.dataset.d, h = +c.dataset.h, m = g[d][h];
      $$(".wr-cell", box).forEach(x => x.classList.toggle("on", x === c));
      read.textContent = `周${DAYS[d]} ${h}:00–${h + 1}:00 · ${m ? `${m} 分钟 · ${what[d][h]}` : "这一小时没有学习记录"}`; });
    onEnter(el, () => { if (!reduce) $$(".wr-cell", box).forEach(c => { if (+getComputedStyle(c).getPropertyValue("--a") > 0) c.animate([{ opacity: 0, transform: "scale(.3)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: (+c.dataset.d * 3 + +c.dataset.h) * 14, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" }); }); });
  }

  /* 目标对账：结果写成「3 / 4」的自动画进度条 */
  const ratio = g => { const m = String(g.result || "").match(/([\d.]+)\s*\/\s*([\d.]+)/); return m ? clamp(+m[1] / +m[2]) : g.status === "done" ? 1 : null; };
  function goals() {
    if (!data.goals?.length) return "";
    return sec("goals", `<div class="wr-goals">${data.goals.map(g => { const r = ratio(g);
      return `<button class="wr-g" aria-expanded="false" data-s="${g.status}">
      <span class="wr-g-top"><span><span class="wr-g-n">${esc(g.name)}</span><span class="wr-g-r">${esc(g.result)}</span></span><span class="wr-stamp">${esc(STATUS[g.status] || g.status)}</span></span>
      ${r != null ? `<span class="wr-g-bar"><i style="--p:${r}"></i></span><em class="wr-g-pct" data-p="${r}">${Math.round(r * 100)}%</em>` : ""}
      <span class="wr-more"><span>${g.good ? `<span class="wr-g-p"><b>做成的：</b>${esc(g.good)}</span>` : ""}${g.gap ? `<span class="wr-g-p"><b>差在哪：</b>${esc(g.gap)}</span>` : ""}</span></span></button>`; }).join("")}</div>`);
  }

  /* 起伏 */
  function mood() {
    const m = data.mood; if (!m?.days?.length) return "";
    const note = m.source === "self" ? "曲线是本人每天打的分。" : `曲线高低是${esc(reader)}读当天的话和做的事画的，不是本人打的分。读不出来的那天留空。`;
    return sec("mood", `<div class="wr-curve"></div><div class="wr-days wr-mdays">${DAYS.map(d => `<span>${d}</span>`).join("")}</div>
      <div class="wr-read" aria-live="polite"></div><p class="wr-note">${note}</p>`);
  }
  function wireMood() {
    const el = $("#wr-mood"); if (!el) return;
    const D = data.mood.days, W = 700, H = 200, x = i => 40 + 620 * i / 6, y = v => 170 - (v - 1) * 35;
    let g = ""; for (let k = 0; k < 5; k++) g += `<line x1="0" x2="${W}" y1="${170 - k * 35}" y2="${170 - k * 35}" class="wr-grid"/>`;
    const pts = D.map((d, i) => d.level == null ? null : [x(i), y(d.level), i]).filter(Boolean);
    let p = ""; pts.forEach((q, k) => { if (!k) { p = `M${q[0]} ${q[1]}`; return; } const a = pts[k - 1], mx = (a[0] + q[0]) / 2; p += ` C${mx} ${a[1]} ${mx} ${q[1]} ${q[0]} ${q[1]}`; });
    g += `<path class="wr-area" d="${p} L${pts.at(-1)[0]} 175 L${pts[0][0]} 175 Z"/><path class="wr-line" d="${p}"/>`;
    pts.forEach(([cx, cy, i]) => g += `<circle class="wr-pt" data-n="${i}" cx="${cx}" cy="${cy}" r="9"/>`);
    D.forEach((d, i) => { if (d.level == null) g += `<text x="${x(i)}" y="${y(3) + 7}" class="wr-gap" text-anchor="middle">?</text>`; });
    const box = $(".wr-curve", el);
    box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="七天的起伏曲线">${g}</svg>`;
    function pick(i) { const d = D[i]; $$(".wr-pt", box).forEach(c => c.classList.toggle("on", +c.dataset.n === i));
      $$(".wr-mdays span", el).forEach((s, k) => s.classList.toggle("on", k === i));
      const by = d.by || data.mood.source;
      $(".wr-read", el).innerHTML = `<div class="wr-who">周${DAYS[i]}${d.quote ? " · 原话" : ""}</div>${d.quote ? `<div class="wr-her">「${esc(d.quote)}」</div>` : `<div class="wr-note">这天没有留下话。</div>`}
        ${d.reading ? `<div class="wr-who">${by === "self" ? "本人" : esc(reader) + "读到的"}</div><div class="wr-mine">${esc(d.reading)}</div>` : ""}`;
      if (!reduce) $(".wr-read", el).animate([{ opacity: 0, transform: "translateY(6px)" }, { opacity: 1, transform: "none" }], { duration: 300, easing: "cubic-bezier(.2,.8,.2,1)" }); }
    D.forEach((d, i) => { const b = document.createElement("button"); b.className = "wr-hit"; b.setAttribute("aria-label", "周" + DAYS[i]);
      b.style.left = x(i) / W * 100 + "%"; b.style.top = (d.level == null ? y(3) : y(d.level)) / H * 100 + "%"; b.onclick = () => pick(i); box.appendChild(b); });
    const low = pts.reduce((a, q) => D[q[2]].level < D[a].level ? q[2] : a, pts[0]?.[2] ?? 0); pick(low);
    ctx.pickMood = pick;
    onEnter(el, () => drawSvg($("svg", box)));
  }

  /* 值得记住的话 */
  function quotes() {
    if (!data.quotes?.length) return "";
    return sec("quotes", `<div class="wr-qtrack">${data.quotes.map((q, k) => `<figure class="wr-qcard" style="--k:${k}"><svg class="wr-qdeco" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34 C 6 25 4 15 11 10 C 16 7 20 11 20 14 C 20 11 24 7 29 10 C 36 15 34 25 20 34Z"/></svg>
      <blockquote class="wr-q-t">${esc(q.text)}</blockquote><figcaption class="wr-q-m">${esc([q.when, q.after].filter(Boolean).join(" · "))}</figcaption>
      ${q.note ? `<p class="wr-q-note"><b>${esc(reader)}：</b>${esc(q.note)}</p>` : ""}</figure>`).join("")}</div>
      ${data.quotes.length > 1 ? `<div class="wr-qdots">${data.quotes.map((_, k) => `<i class="${k ? "" : "on"}"></i>`).join("")}</div>` : ""}`);
  }
  function wireQuotes() {
    const el = $("#wr-quotes"); if (!el) return; const tr = $(".wr-qtrack", el), dots = $$(".wr-qdots i", el), cards = $$(".wr-qcard", el);
    tr.addEventListener("scroll", () => { const k = Math.round(tr.scrollLeft / Math.max(1, cards[0].offsetWidth + 12)); dots.forEach((d, j) => d.classList.toggle("on", j === k)); }, { passive: true });
    dots.forEach((d, j) => d.addEventListener("click", () => tr.scrollTo({ left: j * (cards[0].offsetWidth + 12), behavior: reduce ? "auto" : "smooth" })));
    onEnter(el, () => { if (!reduce) cards.forEach((c, k) => c.animate([{ opacity: 0, transform: "translateX(60px) rotate(3deg)" }, { opacity: 1, transform: "none" }], { duration: 700, delay: k * 120, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" })); });
  }

  /* 复盘 */
  function review() {
    const r = data.review; if (!r) return "";
    const keys = ["good", "improve", "next"].filter(k => r[k]?.length);
    return sec("review", `<div class="wr-tabs" role="group">${keys.map((k, i) => `<button class="wr-tab" data-k="${k}" aria-pressed="${!i}">${esc(REVIEW[k])}</button>`).join("")}</div><ol class="wr-rlist" aria-live="polite"></ol>`);
  }
  function wireReview() {
    const el = $("#wr-review"); if (!el) return;
    const show = k => { $$(".wr-tab", el).forEach(b => b.setAttribute("aria-pressed", b.dataset.k === k));
      const ol = $(".wr-rlist", el); ol.dataset.k = k; ol.innerHTML = data.review[k].map(t => `<li>${esc(t)}</li>`).join("");
      if (!reduce) $$("li", ol).forEach((li, j) => li.animate([{ opacity: 0, transform: "translateX(14px)" }, { opacity: 1, transform: "none" }], { duration: 380, delay: j * 60, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" })); };
    $$(".wr-tab", el).forEach(b => b.onclick = () => show(b.dataset.k)); show($(".wr-tab", el).dataset.k);
  }

  /* 信 */
  function letter() {
    const l = data.letter; if (!l?.paragraphs?.length) return "";
    if (l.title) LABEL.letter.title = l.title;
    return sec("letter", `<div class="wr-letter">${l.paragraphs.map(p => typeof p === "string" ? `<p>${esc(p)}</p>` : `<p class="wr-lsec"><b class="wr-ltag">${esc(p.tag)}</b>${esc(p.text)}</p>`).join("")}<p class="wr-sign">${esc(l.sign || reader)}</p></div>`);
  }

  const m = data.meta;
  /* 主题可以用 story(ctx) 在封面后面插一段自己的叙事，用 modules 选后面跟哪些模块、按什么顺序 */
  const BUILD = { core, split, achievements, timeline, heat, goals, mood, quotes, review, letter };
  root.innerHTML = (m.fictional ? `<div class="wr-fict">示例数据 · 人物虚构</div>` : "") + `<i class="wr-progress" aria-hidden="true"></i>` +
    cover() + (T.story ? T.story(ctx) : "") + (T.modules || ["core", "split", "achievements", "timeline", "heat", "goals", "mood", "quotes", "review", "letter"]).map(k => BUILD[k]()).join("") +
    `<footer class="wr-foot">${m.fictional ? "<p>本页是示例：人物和数据都是虚构的。</p>" : ""}<p>${esc(m.source)}</p><p>标了「${esc(reader)}读到的」的地方是解读，不是记录。</p></footer>`;
  wireCore(); wireSplit(); wireAchievements(); wireTimeline(); wireHeat(); wireMood(); wireQuotes(); wireReview();
  /* 目标：进场时条和百分比一起从 0 长上去 */
  onEnter($("#wr-goals"), () => $$(".wr-g-pct").forEach((e, k) => { const p = +e.dataset.p; if (reduce) return;
    const t0 = performance.now() + k * 120; (function step(t) { const q = clamp((t - t0) / 1200); e.textContent = Math.round(p * 100 * ease(q)) + "%"; if (q < 1) requestAnimationFrame(step); })(t0); }));
  /* 信：一段一段亮起来（主题自己做了滚动版的就跳过） */
  if (!T.letterScrub) onEnter($("#wr-letter"), () => { if (!reduce) $$("#wr-letter .wr-letter p").forEach((p, k) => p.animate([{ opacity: 0, transform: "translateY(12px)" }, { opacity: 1, transform: "none" }], { duration: 600, delay: k * 160, easing: "cubic-bezier(.2,.8,.2,1)", fill: "backwards" })); });
  $$(".wr-g").forEach(b => b.onclick = () => b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") !== "true"));

  /* 封面数字滚动 */
  $$(".wr-cu").forEach(b => { if (b.dataset.v !== "") countUp(b, +b.dataset.v, b.dataset.k, 1100); });
  /* 进场：每一节一次，内容默认可见 */
  $$(".wr-sec, [data-rv]").forEach(el => onEnter(el));
  /* 顶部阅读进度 */
  const prog = $(".wr-progress");
  const onScroll = () => { const max = document.documentElement.scrollHeight - innerHeight; prog.style.transform = `scaleX(${max > 0 ? clamp(scrollY / max) : 0})`; };
  addEventListener("scroll", () => requestAnimationFrame(onScroll), { passive: true }); onScroll();
  if (T.after) T.after(ctx);
  /* 重播封面（录视频时用）：数字重新滚，主题自己的开场再来一遍 */
  ctx.replayCover = () => { $$("header .wr-cu").forEach(b => { if (b.dataset.v !== "") countUp(b, +b.dataset.v, b.dataset.k, 1100); }); if (T.replay) T.replay(ctx); };
  window.WR = ctx;   // 给录视频和调试用
})();

</script>
</body>
</html>
