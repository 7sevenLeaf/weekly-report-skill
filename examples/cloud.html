<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>个人周报 第15周</title>
<meta name="generator" content="weekly-report skill · 主题：云白">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&amp;family=Noto+Sans+SC:wght@400;500;700;900&amp;display=swap"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css">
<style>
/* 周报套件的骨架样式。颜色、字体、质感都用变量，交给主题定。
   规矩：一个强调色 + 灰阶；正文不小于 15px，说明不小于 13px；数字等宽；不出现横向滚动；不发光。 */
:root{
  --bg:#F3F2EE; --bg2:#E9E7E1; --ink:#1C1C1A; --ink2:#4E4D49; --mute:#86847E; --rule:rgba(28,28,26,.14);
  --accent:#E8552B; --accent-ink:#fff;
  /* 类别：强调色深浅 + 中性灰，不再加新颜色 */
  --c-study:var(--accent); --c-star:var(--ink); --c-sport:color-mix(in oklab,var(--accent) 55%,var(--bg));
  --c-life:color-mix(in oklab,var(--ink) 28%,var(--bg)); --c-sleep:color-mix(in oklab,var(--ink) 12%,var(--bg)); --c-none:transparent;
  --font:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:var(--font); --font-say:var(--font); --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --gap:64px; --r:0px;
}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:clip;font-synthesis:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
svg{max-width:100%}
h1,h2,h3{text-wrap:balance} p{text-wrap:pretty}
#wr{position:relative;max-width:620px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-right,0px)) 80px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:var(--gap);font-variant-numeric:tabular-nums}

.wr-fict{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;padding:3px 12px;font-size:12px;letter-spacing:.06em;background:var(--ink);color:var(--bg);border-radius:99px;pointer-events:none;opacity:.9;white-space:nowrap}
.wr-progress{position:fixed;left:0;right:0;top:0;height:3px;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);z-index:6;pointer-events:none}

/* 进场：默认可见，只做一次轻微上浮 */
.wr-move .wr-sec{opacity:.001;transform:translateY(18px);transition:opacity .6s var(--ease),transform .7s var(--ease)}
.wr-move .wr-sec.wr-in{opacity:1;transform:none}

/* 封面（主题通常会改写） */
.wr-cover{min-height:min(86vh,760px);display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.wr-kicker{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink2)}
.wr-title{margin:0;font-weight:900;font-size:clamp(76px,25vw,150px);line-height:1;letter-spacing:-.02em}
.wr-name{font-size:18px;font-weight:700}
.wr-cover-nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.wr-cover-nums div{padding:12px 10px 0 0}
.wr-cover-nums div+div{border-left:1px solid var(--rule);padding-left:12px}
.wr-cover-nums b{display:block;font-family:var(--font-num);font-size:clamp(28px,9vw,44px);line-height:1.05}
.wr-cover-nums span{font-size:13px;color:var(--ink2)}

/* 小标题 */
.wr-h{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid var(--ink)}
.wr-h h2{margin:0;font-size:26px;line-height:1.2;font-weight:900;letter-spacing:-.01em}
.wr-hint{font-size:13px;color:var(--mute)}
.wr-note{font-size:13px;color:var(--mute);margin:10px 0 0;line-height:1.65}

/* 切换按钮 */
.wr-tabs{display:flex;gap:6px;flex-wrap:wrap}
.wr-tab{all:unset;cursor:pointer;padding:7px 14px;border:1px solid var(--rule);border-radius:99px;font-size:14px;font-weight:700;color:var(--ink2);transition:background .2s var(--ease),color .2s var(--ease),border-color .2s}
.wr-tab[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wr-tab:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wr-tab:active{transform:scale(.97)}

/* 核心数据 */
.wr-big{font-family:var(--font-num);font-weight:900;font-size:clamp(84px,27vw,150px);line-height:.95;margin-top:20px;letter-spacing:-.03em;color:var(--ink)}
.wr-cmp{margin:8px 0 0;font-size:15px;color:var(--ink2)}
.wr-cmp b{color:var(--ink)}
.wr-bars{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:150px;align-items:end;margin-top:24px;border-bottom:1px solid var(--ink)}
.wr-bar{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.wr-bar b{font-size:12px;font-weight:700;white-space:nowrap;color:var(--ink2)}
.wr-bar i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:2px 2px 0 0;transition:height .8s var(--ease),opacity .2s}
.wr-bar i.wr-zero{background:var(--rule)}
.wr-bar.on i{opacity:.55}
.wr-bar.on b{color:var(--accent)}
.wr-goal{position:absolute;left:0;right:0;border-top:1px dashed var(--ink2);transition:bottom .6s var(--ease);pointer-events:none}
.wr-goal span{position:absolute;left:0;top:-20px;font-size:12px;color:var(--ink2);background:var(--bg);padding-right:6px}
.wr-days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-weight:700;font-size:13px;margin-top:6px;color:var(--ink2)}

/* 时间花在哪 */
.wr-stack{display:flex;height:44px;gap:2px}
.wr-seg{all:unset;cursor:pointer;flex-basis:0;min-width:3px;transform-origin:0 50%;transition:opacity .2s}
.wr-seg.off{opacity:.25}
.wr-legend{display:flex;flex-direction:column;margin-top:14px}
.wr-li{all:unset;cursor:pointer;display:grid;grid-template-columns:18px 1fr auto 46px;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:15px;transition:opacity .2s}
.wr-li b{font-weight:700} .wr-li em{font-style:normal;color:var(--mute);text-align:right;font-size:13px}
.wr-li.off{opacity:.45}
.wr-mini{margin-top:16px;min-height:96px}
.wr-mbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px}
.wr-mbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;height:100%}
.wr-mbars i{display:block;width:100%;max-width:22px;border-radius:2px 2px 0 0;transform-origin:50% 100%}
.wr-mbars b{font-size:11px;color:var(--ink2);white-space:nowrap}
.wr-mbars span{font-size:12px;font-weight:700;color:var(--mute)}

/* 成就 */
.wr-alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wr-a{padding:26px 0;border-bottom:1px solid var(--rule)}
.wr-a:first-child{padding-top:4px}
.wr-a-top{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:baseline}
.wr-rank{font-family:var(--mono);font-size:13px;color:var(--mute)}
.wr-a-big{font-family:var(--font-num);font-weight:900;font-size:clamp(40px,12vw,64px);line-height:1;letter-spacing:-.02em;color:var(--ink)}
.wr-a-what{font-weight:700;font-size:17px;margin-top:8px}
.wr-a-what span{font-weight:400;color:var(--ink2);font-size:15px}
.wr-fig{margin:18px 0 0;padding:16px;background:var(--bg2);border-radius:var(--r);cursor:pointer}
.wr-fig svg{display:block;width:100%;height:auto;overflow:visible}
.wr-fig text{font-family:var(--font);font-size:11px;fill:var(--ink)}
.wr-a-detail{margin:14px 0 0;font-size:16px}
.wr-say{margin:8px 0 0;font-family:var(--font-say);font-size:16px;font-weight:700;color:var(--ink);line-height:1.6;padding-left:12px;border-left:2px solid var(--accent)}

/* 时间线 */
.wr-now{display:flex;align-items:baseline;gap:12px;min-height:40px;margin-bottom:10px}
.wr-now b{font-family:var(--font-num);font-size:26px;font-weight:900;white-space:nowrap}
.wr-now span{font-size:15px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr-tl{position:relative;display:flex;flex-direction:column;gap:5px;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.wr-row{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center}
.wr-row b{font-size:13px;color:var(--mute)}
.wr-row.on b{color:var(--ink)}
.wr-track{position:relative;display:block;height:24px;background:var(--bg2);border-radius:var(--r);overflow:hidden}
.wr-row.on .wr-track{box-shadow:inset 0 0 0 1px var(--ink)}
.wr-blk{position:absolute;top:3px;bottom:3px;border-radius:2px;transform-origin:0 50%}
.wr-cursor{position:absolute;top:-6px;bottom:-6px;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;transition:left .08s linear}
.wr-axis{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:11px;color:var(--mute);margin-top:6px}
.wr-axis div{display:flex;justify-content:space-between}
.wr-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-top:12px}
.wr-key span{display:inline-flex;align-items:center;gap:6px}
.wr-dayd{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);min-height:150px}
.wr-dayd h3{margin:0 0 8px;font-size:17px}
.wr-dayd ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.wr-dayd li{display:grid;grid-template-columns:22px 92px 1fr;gap:6px;font-size:15px;align-items:start;padding:4px 6px;margin:0 -6px;border-radius:4px;transition:background .2s}
.wr-dayd li.on{background:var(--bg2)}
.wr-dayd li em{font-style:normal;color:var(--ink2);line-height:1.4}
.wr-dayd li em svg{width:18px;height:18px;vertical-align:-4px}
.wr-dayd li span:nth-child(2){font-size:13px;color:var(--mute);padding-top:2px}
.wr-glyph{font-family:"Times New Roman",Times,serif;font-size:17px}

/* 专注时段 7×24 */
.wr-heat{display:grid;grid-template-columns:22px repeat(24,1fr);gap:2px;align-items:center}
.wr-heat b{font-size:12px;color:var(--mute);font-weight:700}
.wr-cell{all:unset;cursor:pointer;aspect-ratio:1;border-radius:2px;background:color-mix(in oklab,var(--accent) calc(var(--a)*100%),var(--bg2))}
.wr-cell.on{outline:2px solid var(--ink);outline-offset:1px}
.wr-hax{display:grid;grid-template-columns:22px 1fr;gap:2px;font-size:11px;color:var(--mute);margin-top:6px}
.wr-hax div{display:flex;justify-content:space-between}
.wr-hread{font-size:15px;margin:14px 0 0;min-height:26px}

/* 目标 */
.wr-goals{display:flex;flex-direction:column}
.wr-g{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:16px 0;border-bottom:1px solid var(--rule)}
.wr-g-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.wr-g-n{display:block;font-weight:700;font-size:17px}
.wr-g-r{display:block;font-size:14px;color:var(--ink2)}
.wr-stamp{flex:none;font-weight:700;font-size:12px;padding:2px 10px;border:1px solid currentColor;border-radius:99px;color:var(--ink2)}
.wr-g[data-s="done"] .wr-stamp{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.wr-g[data-s="missed"] .wr-stamp{color:var(--mute)}
.wr-g-bar{display:block;height:4px;margin-top:12px;background:var(--bg2);border-radius:2px;overflow:hidden}
.wr-g-bar i{display:block;height:100%;width:calc(var(--p)*100%);background:var(--ink);border-radius:2px;transform-origin:0 50%}
.wr-g[data-s="done"] .wr-g-bar i{background:var(--accent)}
.wr-move .wr-s-goals:not(.wr-in) .wr-g-bar i{transform:scaleX(0)}
.wr-move .wr-g-bar i{transition:transform 1s var(--ease) .2s}
.wr-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.wr-more>span{overflow:hidden}
[aria-expanded="true"]>.wr-more{grid-template-rows:1fr}
.wr-g-p{display:block;margin-top:8px;font-size:15px}

/* 起伏 */
.wr-curve{position:relative}
.wr-curve svg{display:block;width:100%;height:auto;overflow:visible}
.wr-grid{stroke:var(--rule);stroke-width:1}
.wr-area{fill:var(--accent);opacity:.08;stroke:none}
.wr-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.wr-pt{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.wr-pt.on{fill:var(--accent)}
.wr-gap{font-size:22px;fill:var(--mute)}
.wr-hit{all:unset;position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;cursor:pointer}
.wr-hit:focus-visible{outline:2px solid var(--accent)}
.wr-mdays span.on{color:var(--accent)}
.wr-read{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule);min-height:160px}
.wr-who{font-size:13px;color:var(--mute)}
.wr-her{font-weight:900;font-size:clamp(21px,6vw,27px);line-height:1.45;margin:2px 0 12px}
.wr-mine{font-family:var(--font-say);font-size:16px;line-height:1.7;color:var(--ink)}

/* 话 */
.wr-q{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer}
.wr-q-t{display:block;font-weight:900;font-size:clamp(26px,7.4vw,36px);line-height:1.45;min-height:4.4em;letter-spacing:-.01em}
.wr-q-m{display:block;font-size:14px;color:var(--ink2);margin-top:10px;min-height:22px}
.wr-q-n{display:block;font-size:13px;color:var(--mute);margin-top:12px;text-align:right}

/* 复盘 */
.wr-rlist{margin:16px 0 0;padding:0;list-style:none;counter-reset:r}
.wr-rlist li{counter-increment:r;display:grid;grid-template-columns:36px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:16px}
.wr-rlist li::before{content:counter(r,decimal-leading-zero);font-family:var(--mono);font-size:13px;color:var(--mute);padding-top:4px}

/* 信 */
.wr-letter p{margin:0 0 14px;font-family:var(--font-say);font-size:17px;line-height:1.85}
.wr-letter .wr-sign{text-align:right;font-weight:900;margin:0}

.wr-foot{text-align:center;font-size:13px;color:var(--mute)}
.wr-foot p{margin:4px 0}

/* 类别色块：放在最后，免得被按钮的 all:unset 冲掉 */
.wr-c-study{background:var(--c-study)} .wr-c-sport{background:var(--c-sport)} .wr-c-life{background:var(--c-life)} .wr-c-star{background:var(--c-star)}
.wr-c-sleep{background:var(--c-sleep)} .wr-c-none{background:transparent;box-shadow:inset 0 0 0 1px var(--rule)}
.wr-sw{display:inline-block;width:10px;height:10px;border-radius:2px;flex:none}


@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ====== 第八版：所有主题共享的升级 ====== */
/* 原话：暖色纸卡，文雅的字，下面一句走心的评价；左右滑 */
.wr-qtrack{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 12px;scrollbar-width:none}
.wr-qtrack::-webkit-scrollbar{display:none}
.wr-qcard{position:relative;flex:0 0 86%;margin:0;scroll-snap-align:center;border-radius:var(--qr,22px);padding:24px 20px 18px;
  background:linear-gradient(150deg,var(--q1,#FFF7EC),var(--q2,#FCE6DD));color:var(--qink,#3B2A22);box-shadow:0 10px 28px rgba(120,70,40,.10),inset 0 1px 0 rgba(255,255,255,.8);overflow:hidden}
.wr-qcard::before{content:"“";position:absolute;left:12px;top:-18px;font-family:Georgia,serif;font-size:110px;line-height:1;color:var(--qmark,#F2A27E);opacity:.35}
.wr-qdeco{position:absolute;right:14px;top:14px;width:26px;height:26px;fill:var(--qmark,#F2A27E);opacity:.55}
.wr-qcard .wr-q-t{display:block;margin:0;padding-top:12px;font-family:var(--font-quote,"LXGW WenKai","Kaiti SC","STKaiti","KaiTi","Noto Serif SC",serif);font-weight:400;letter-spacing:.02em;font-size:clamp(22px,6.4vw,28px);line-height:1.55;color:inherit;min-height:0;background:none}
.wr-qcard .wr-q-m{display:block;margin-top:10px;font-size:13px;opacity:.7}
.wr-q-note{font-family:"LXGW WenKai",var(--font);margin:14px 0 0;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.55);font-size:14px;line-height:1.65}
.wr-q-note b{color:var(--qmark,#E07A55);font-weight:700}
.wr-qdots{display:flex;gap:6px;justify-content:center}
.wr-qdots i{width:6px;height:6px;border-radius:3px;background:rgba(0,0,0,.18);cursor:pointer;transition:width .3s,background .3s}
.wr-qdots i.on{width:18px;background:var(--accent)}
/* 信：按方面分段 */
.wr-lsec{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.wr-ltag{display:inline-block;font-family:var(--font);font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent);white-space:nowrap;margin-top:3px}
/* 目标：百分比 */
.wr-g-pct{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--ink2);margin-top:4px;text-align:right;font-variant-numeric:tabular-nums}
.wr-move .wr-g-bar i{transition:transform 1.2s var(--ease) .15s}
/* 168 小时大环图 */
.wr-donut{display:grid;place-items:center;margin-bottom:6px}
.wr-donut svg{width:200px;height:200px;overflow:visible}
.wr-dseg{cursor:pointer;transition:opacity .25s}
.wr-dseg.off{opacity:.22}
.wr-dc1{font-size:13px;fill:var(--ink2)} .wr-dc2{font-size:26px;font-weight:800;fill:var(--ink);font-family:var(--font-num)}
.wr-dc-study{stroke:var(--c-study)} .wr-dc-sport{stroke:var(--c-sport)} .wr-dc-life{stroke:var(--c-life)} .wr-dc-star{stroke:var(--c-star)} .wr-dc-sleep{stroke:var(--c-sleep)} .wr-dc-none{stroke:var(--rule)}

/* —— 主题：云白 —— */
/* 云白（第四版）：沉浸版 + 意象可视化。
   第三版打 6 分：「简洁高级还行，但普通，没有眼前一亮；要炫技动画、数据交互、元素意象的可视化」。
   实测第三版叙事部分图形只占画面 1.8%、41 屏里 39 屏没有能点的东西，所以这一版让画面被「数据画成的东西」占满：
   168 个小时方块拼出周数、每天一片真的天空（太阳按时钟走、月亮圆缺=睡够没有、星星数=睡了几小时、天气=情绪）、
   学习一小时掉一本书、运动时心跳线跳起来、成就卡 3D 倾斜 + 数字滚轮 + 彩纸、一周天气收拢。
   配色仍按四张参考量出的三层：中性浅灰底、粉彩意象、一个钴蓝主角。 */
:root{
  --bg:#F2F3F5; --bg2:#E9EBEF; --card:#FFFFFF; --ink:#16181D; --ink2:#5A5F6B; --mute:#8E93A0; --rule:rgba(22,24,29,.08);
  --accent:#3D6BF2; --accent-ink:#fff;
  --t-study:#DCE7FB; --t-sport:#D6F2E7; --t-sleep:#E8E1F8; --t-life:#FCE3DA; --t-star:#FBF3C8;
  --c-study:#8FB2F2; --c-sport:#8DD9BF; --c-sleep:#C9BCEF; --c-life:#F5B9A6; --c-star:#EFD46A; --c-none:#E3E5EA;
  --sun:#FFC95C; --moon:#FFF7E3; --hill1:#C3E9D9; --hill2:rgba(255,255,255,.82);
  --font:"Inter","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Inter","Noto Sans SC",system-ui,sans-serif;
  --shadow:0 1px 2px rgba(22,24,29,.04),0 10px 30px rgba(22,24,29,.06);
  --gap:24px; --r:24px;
}
body{background:var(--bg)}
#wr{display:block;max-width:none;padding:0 0 90px;gap:0}
#wr>*:not(.cl-intro):not(.cl-day):not(.cl-ach):not(.cl-sum){max-width:620px;margin-left:auto;margin-right:auto;width:calc(100% - 32px)}
.wr-progress{display:none}

/* 时钟 */
.cl-clock{position:fixed;left:16px;top:14px;z-index:20;display:flex;align-items:baseline;gap:8px;padding:8px 14px;border-radius:99px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);box-shadow:var(--shadow);opacity:0;transform:translateY(-8px);transition:opacity .4s var(--ease),transform .4s var(--ease);pointer-events:none}
.cl-clock.on{opacity:1;transform:none}
.cl-clock b{font-size:15px;font-weight:700}
.cl-clock span{font-family:var(--font-num);font-weight:800;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* 开场：168 个小时 */
.cl-intro{position:relative;height:100vh;min-height:640px;overflow:hidden}
.cl-ipin{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px}
.cl-kick{font-size:14px;color:var(--ink2)}
.cl-kick b{color:var(--ink)}
.cl-cells{position:relative;width:360px;height:250px;margin:22px auto 0;touch-action:pan-y}
.cl-cell{position:absolute;left:0;top:0;width:13px;height:13px;border-radius:3.5px;background:var(--c);will-change:transform}
.cl-cell.hit{outline:2px solid var(--accent);outline-offset:1px;z-index:2}
.cl-gdays{position:absolute;left:-18px;top:0;display:flex;flex-direction:column;font-size:11px;color:var(--mute);opacity:0}
.cl-gdays span{height:15px;line-height:13px}
.cl-gaxis{position:absolute;left:0;right:0;display:flex;justify-content:space-between;font-size:10px;color:var(--mute);opacity:0;font-family:var(--font-num)}
.cl-leads{position:relative;height:56px;width:100%;margin-top:14px}
.cl-lead{position:absolute;left:0;right:0;margin:0;font-size:17px;color:var(--ink2)}
.cl-lead b{color:var(--ink)}
.cl-read{min-height:22px;font-size:14px;color:var(--ink);margin-top:2px}
.cl-read b{color:var(--accent);font-family:var(--font-num)}
.cl-key{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;font-size:12px;color:var(--ink2);margin-top:10px;opacity:0}
.cl-key span{display:inline-flex;align-items:center;gap:5px}
.cl-key i{width:10px;height:10px;border-radius:3px}
.cl-down{position:absolute;bottom:24px;left:50%;margin-left:-12px;width:24px;height:36px;border:2px solid var(--mute);border-radius:12px;opacity:.7}
.cl-down::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:7px;margin-left:-2px;border-radius:2px;background:var(--mute)}
.wr-move .cl-down::after{animation:cl-wheel 1.6s var(--ease) 4}
@keyframes cl-wheel{from{transform:translateY(0);opacity:1}to{transform:translateY(12px);opacity:0}}

/* 一天：上面一片天空，下面这一天的事 */
.cl-day{position:relative;height:100vh;min-height:640px;overflow-x:clip}
.cl-din{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--sky,#EEF2F8);overflow:hidden}
.cl-stage{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:400/330;max-height:46vh;flex:none;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cl-stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.cl-stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cl-dhead{position:absolute;left:18px;top:66px;display:flex;align-items:baseline;gap:10px;pointer-events:none}
.cl-dn{font-weight:900;font-size:clamp(44px,13vw,66px);line-height:1;letter-spacing:-.02em;color:var(--ink)}
.cl-dd{font-size:13px;color:var(--ink2)}
.cl-tip{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.85);box-shadow:var(--shadow);font-size:12px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.cl-tip.on{opacity:1}
.cl-hint{position:absolute;right:14px;top:72px;font-size:11px;color:var(--ink2);background:rgba(255,255,255,.6);padding:3px 9px;border-radius:99px}
.sky-star{fill:#fff}
.wr-move .sky-star{animation:cl-tw 2.4s ease-in-out infinite alternate}
@keyframes cl-tw{from{opacity:.35}to{opacity:1}}
.sky-sun{cursor:grab}
.sky-rays line{stroke:var(--sun);stroke-width:3;stroke-linecap:round}
.wr-move .sky-rays{animation:cl-spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes cl-spin{to{transform:rotate(360deg)}}
.sky-cloud{fill:#fff}
.sky-book{cursor:pointer}
.sky-book.on{stroke:var(--accent);stroke-width:2}
.sky-ecg{fill:none;stroke:var(--c-sport);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cl-dbody{flex:1;min-height:0;width:100%;max-width:560px;margin:0 auto;padding:10px 18px 18px;display:flex;flex-direction:column;justify-content:flex-start}
.cl-say{padding:10px 14px;border-radius:18px 18px 18px 6px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);font-weight:700;font-size:16px;line-height:1.45;align-self:flex-start;max-width:100%}
.cl-say small{display:block;font-weight:400;font-size:12px;color:var(--mute);margin-top:2px}
.cl-say .cl-wx{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin-right:6px}
.cl-evs{list-style:none;margin:10px 0 0;padding:8px;border-radius:20px;background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.cl-ev{display:grid;grid-template-columns:44px 26px 1fr auto;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;font-size:14px;cursor:pointer;transition:background .35s var(--ease),opacity .35s,transform .45s var(--ease)}
.cl-ev time{font-family:var(--font-num);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.cl-ev i{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--tint)}
.cl-ev i svg{width:15px;height:15px}
.cl-ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-ev b{font-family:var(--font-num);font-size:12px;font-weight:600;color:var(--ink2)}
.cl-ev[data-c="study"]{--tint:var(--t-study)} .cl-ev[data-c="sport"]{--tint:var(--t-sport)} .cl-ev[data-c="life"]{--tint:var(--t-life)}
.cl-ev[data-c="star"]{--tint:var(--t-star)} .cl-ev[data-c="sleep"]{--tint:var(--t-sleep)}
.cl-live .cl-ev{opacity:.25}
.cl-live .cl-ev.on{opacity:1}
.cl-ev.now{background:var(--tint)}
.cl-ev.now time{color:var(--accent);font-weight:700}
.cl-dsum{margin-top:8px;font-size:12px;color:var(--ink2);font-family:var(--font-num)}
.cl-dsum b{color:var(--ink)}

/* 成就：3D 卡 */
.cl-ach{position:relative;padding:14vh 16px;perspective:1100px;overflow-x:clip}
.cl-acard{position:relative;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px;box-shadow:0 2px 4px rgba(22,24,29,.04),0 30px 60px rgba(22,24,29,.10);padding:26px 22px 24px;transform-style:preserve-3d;will-change:transform;touch-action:pan-y}
.cl-glare{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.75),rgba(255,255,255,0) 45%);mix-blend-mode:soft-light;opacity:.9}
.cl-atag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:color-mix(in oklab,var(--accent) 10%,#fff);padding:3px 10px;border-radius:99px}
.cl-abig{margin:14px 0 0;font-family:var(--font-num);font-weight:800;font-size:clamp(60px,18vw,104px);line-height:1;letter-spacing:-.04em;white-space:nowrap}
.cl-abig>span{display:inline-block;vertical-align:top}
.cl-slot{height:1em;overflow:hidden}
.cl-reel{display:flex;flex-direction:column}
.cl-reel span{display:block;height:1em}
.cl-awhat{margin-top:8px;font-weight:700;font-size:18px}
.cl-afig{margin:18px 0 0;padding:16px;border-radius:18px;background:var(--tint,var(--t-study));overflow:hidden;transform:translateZ(30px)}
.cl-afig svg{display:block;width:100%;height:auto;overflow:visible}
.cl-afig text{font-family:var(--font);font-size:11px;fill:var(--ink)}
.cl-adetail{margin:14px 0 0;font-size:16px;line-height:1.7;color:var(--ink2)}
.cl-asay{margin:10px 0 0;font-weight:700;font-size:17px;line-height:1.6}
.cl-tiltme{position:absolute;right:18px;top:24px;font-size:11px;color:var(--mute)}
.cl-confetti{position:fixed;inset:0;z-index:15;pointer-events:none;width:100vw;height:100vh}

/* 收拢：一周天气 */
.cl-sum{position:relative;height:100vh;min-height:640px;overflow-x:clip}
.cl-sin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 16px}
.cl-sin h2{margin:0;font-weight:900;font-size:clamp(40px,12vw,64px);letter-spacing:-.02em}
.cl-sin>p{margin:6px 0 0;color:var(--ink2)}
.cl-tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(100%,520px);margin-top:22px;perspective:800px}
.cl-tile{all:unset;cursor:pointer;position:relative;aspect-ratio:3/4.2;transform-style:preserve-3d;transition:transform .7s var(--ease)}
.cl-tile.flip{transform:rotateY(180deg)}
.cl-tile>span{position:absolute;inset:0;border-radius:14px;background:var(--card);box-shadow:var(--shadow);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink2)}
.cl-tile>span b{font-size:13px;color:var(--ink)}
.cl-tile svg{width:30px;height:30px}
.cl-tile .bk{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,var(--dt));color:var(--ink);font-family:var(--font-num);font-size:10.5px;line-height:1.35;padding:4px}
.cl-tile .bk b{color:var(--da);font-size:11px}
.cl-snums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(100%,560px);margin-top:20px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cl-snums div{position:relative;background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px 8px 14px;cursor:pointer;transition:transform .2s}
.cl-snums b{display:block;font-family:var(--font-num);font-weight:800;font-size:clamp(28px,8.6vw,44px);letter-spacing:-.04em;line-height:1}
.cl-snums div:first-child b{color:var(--accent)}
.cl-snums span{display:block;margin-top:6px;font-size:13px;color:var(--ink2)}
.cl-snums em{display:block;font-style:normal;font-size:12px;color:var(--mute);min-height:16px}
.cl-snums.cmp div{transform:scale(.97)}
.cl-snums.cmp b{color:var(--mute)!important}
.cl-shint{margin-top:10px;font-size:12px;color:var(--mute)}

/* 后面接的套件模块 */
.wr-sec{margin-top:16px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:24px 20px}
.wr-h{border-bottom:0;padding-bottom:0}
.wr-h h2{font-size:24px}
.wr-tab{border:0;background:var(--bg);color:var(--ink2)}
.wr-tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.wr-stack{height:40px;border-radius:12px;overflow:hidden;gap:2px}
.wr-stamp{border:0;background:var(--bg);color:var(--ink2)}
.wr-g[data-s="done"] .wr-stamp{background:color-mix(in oklab,var(--accent) 12%,#fff);color:var(--accent)}
.wr-g-bar{background:var(--bg);height:6px;border-radius:3px}
.wr-g-bar i{background:var(--c-study);border-radius:3px}
.wr-g[data-s="done"] .wr-g-bar i{background:var(--accent)}
.wr-q-t{font-weight:800;letter-spacing:-.01em}
.wr-rlist li::before{color:var(--accent);font-family:var(--font-num);font-weight:700}
.wr-letter p{font-size:17px}
.wr-fict{background:rgba(22,24,29,.78);backdrop-filter:blur(10px)}
.wr-foot{margin-top:40px}

/* 静止版：全部摊开，意象画成静态 */
.cl-static .cl-intro,.cl-static .cl-day,.cl-static .cl-sum{height:auto;min-height:0}
.cl-static .cl-din,.cl-static .cl-sin{position:relative;inset:auto}
.cl-static .cl-din{padding-bottom:20px}
.cl-static .cl-ipin{padding:70px 16px 40px}
.cl-static .cl-down,.cl-static .cl-clock,.cl-static .cl-hint{display:none}
.cl-static .cl-gdays,.cl-static .cl-gaxis,.cl-static .cl-key{opacity:1}
.cl-static .cl-sin{padding:60px 16px}
.cl-static .cl-reel{transform:translateY(-95%)}

/* ====== 第五版（第四版打 7 分后）：每天自己的色调和主题元素、活动动效、心情特效、大块主题转场、毛玻璃、每天不同的数据面板 ====== */
.cl-day{--da:var(--accent);--dt:var(--t-study)}
.cl-din{background:linear-gradient(180deg,var(--sky,#EEF2F8) 0%,var(--sky,#EEF2F8) 38%,color-mix(in oklab,var(--dt) 70%,var(--sky,#EEF2F8)) 100%)}
.cl-day[data-sig="rain"] .cl-din{background:linear-gradient(180deg,color-mix(in oklab,var(--sky) 55%,#8F9BB5) 0%,color-mix(in oklab,var(--sky) 70%,#A9B3C9) 45%,color-mix(in oklab,var(--dt) 70%,#C9D0DE) 100%)}
.cl-stage{max-height:37vh}
/* 毛玻璃（Apple 风格）：半透明白 + 背景模糊增饱和 + 一道内高光 */
.cl-glass,.cl-say,.cl-evs,.cl-panel,.cl-clock,.cl-tile>span,.cl-snums div{background:rgba(255,255,255,.42)!important;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 8px 32px rgba(40,50,90,.10)}
.cl-tile .bk{background:linear-gradient(160deg,rgba(255,255,255,.9),var(--dt))!important;border-color:rgba(255,255,255,.7)}
.cl-blob{position:absolute;border-radius:50%;filter:blur(38px);opacity:.75;pointer-events:none;will-change:transform}
.cl-dbody{position:relative;gap:8px;padding-top:6px}
.cl-dbody>*{position:relative}
.cl-say{font-size:15px;padding:9px 13px}
.cl-say .q{display:inline}
.cl-say .q span{display:inline-block;white-space:pre}
.cl-evs{margin-top:0;padding:6px}
.cl-ev{padding:3px 8px;font-size:13.5px;grid-template-columns:42px 24px 1fr auto}
.cl-ev i{width:24px;height:24px}
.cl-ev.now{background:color-mix(in oklab,var(--da) 18%,rgba(255,255,255,.6))}
.cl-ev.now time{color:var(--da)}
.cl-dsum{display:none}
/* 当天数据面板 */
.cl-panel{border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;min-height:118px}
.cl-panel.wide{grid-template-columns:1fr}
.cl-panel svg{display:block;overflow:visible}
.cl-panel h4{margin:0 0 6px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.cl-panel h4 b{color:var(--da);font-family:var(--font-num)}
.cl-leg{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px}
.cl-leg li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.cl-leg i{width:9px;height:9px;border-radius:3px;flex:none}
.cl-leg b{margin-left:auto;font-family:var(--font-num);font-weight:700}
.cl-bars{display:flex;flex-direction:column;gap:6px}
.cl-bar{display:grid;grid-template-columns:52px 1fr 40px;align-items:center;gap:8px;font-size:12px}
.cl-bar s{position:relative;height:10px;border-radius:5px;background:rgba(22,24,29,.07);text-decoration:none;overflow:visible}
.cl-bar s i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--da);transform-origin:0 50%}
.cl-bar s i.avg{background:rgba(22,24,29,.22);height:4px;top:3px}
.cl-bar s u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.cl-bar b{font-family:var(--font-num);text-align:right}
.cl-big{font-family:var(--font-num);font-weight:800;font-size:28px;letter-spacing:-.03em;line-height:1;color:var(--da)}
.cl-sub{font-size:12px;color:var(--ink2);margin-top:4px}
/* 活动动效、转场元素 */
.v-act{opacity:0;transition:opacity .45s}
.v-act.on{opacity:1}
.cl-trans{position:absolute;left:0;right:0;top:0;height:100vh;z-index:4;pointer-events:none;overflow:visible}
.cl-trans svg{position:absolute;width:190px;height:190px;left:0;top:0;overflow:visible;filter:drop-shadow(0 18px 30px rgba(30,40,80,.18))}
.cl-static .cl-trans{display:none}

/* ====== 第六版（第五版打 8 分后）：更通透的玻璃、极光底、更大胆的转场、总结区重做 ====== */
/* 玻璃：更透（白 18–26%）、更强的模糊和饱和、渐变描边、左上角高光、边缘光 */
.cl-glass,.cl-say,.cl-evs,.cl-panel,.cl-clock,.cl-tile>span,.cl-snums div,.wr-sec{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.12))!important;
  backdrop-filter:blur(30px) saturate(210%) brightness(1.04);-webkit-backdrop-filter:blur(30px) saturate(210%) brightness(1.04);
  border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -1px 0 rgba(255,255,255,.18),inset 1px 0 0 rgba(255,255,255,.35),0 12px 40px rgba(30,40,90,.12)!important}
.cl-say::before,.cl-evs::before,.cl-panel::before,.wr-sec::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 60% at 0% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 55%);mix-blend-mode:soft-light}
.cl-tile .bk{background:linear-gradient(160deg,rgba(255,255,255,.92),var(--dt))!important;color:var(--ink)!important}
.cl-blob{filter:blur(46px);opacity:.85}
.cl-din .cl-blob:nth-of-type(1){opacity:.42!important}
/* 极光底：总结区后面流动的色块，让玻璃看得出来 */
.cl-aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity 1s var(--ease)}
.cl-aurora.on{opacity:1}
.cl-aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
body{isolation:isolate}
/* 两层大块转场：主色色带领先，新的一天跟在后面 */
.cl-wash{position:absolute;inset:0;z-index:0;pointer-events:none}
.cl-din{z-index:1}
.cl-trans svg.big{width:min(72vw,430px);height:min(72vw,430px);filter:drop-shadow(0 30px 50px rgba(30,40,80,.22))}
.cl-trans .pt{position:absolute;left:0;top:0;border-radius:50%;pointer-events:none}
/* 面板交互 */
.cl-panel [data-k],.cl-panel .cl-bar,.cl-panel .pd,.cl-panel svg{cursor:pointer}
.cl-panel .pr.dim{opacity:.25}
.cl-panel .cl-bar.on span{color:var(--da);font-weight:800}
.cl-panel .cl-pop{grid-column:1/-1;font-size:12px;color:var(--ink2);min-height:16px}
.cl-panel .cl-pop b{color:var(--ink)}
.cl-panel .pd.hit{stroke:var(--ink);stroke-width:2}
.cl-panel .spark{grid-column:1/-1}
/* 总结区 */
.cl-donut{display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:center}
.cl-donut svg{width:200px;height:200px;overflow:visible}
.cl-donut .seg{cursor:pointer;transition:opacity .25s,stroke-width .25s}

<script>
/* 每一天的「主角」系统（第五版）。试用者给的例子（化学摇试管、跑步、心情失落下雨）只是启发，这里把它推成一套通用规则：
   1. 读当天的事：每件事归到一个意象类型（实验、考试、读书、代码、跑步、游泳、力量、球、音乐、见面、放松、休息）；
   2. 读当天的心情：不只看分数，也看原话里的词（慌→焦虑、累/阈值→疲惫、难受→低落、！！→兴奋）；
   3. 选主角：强烈的情绪 > 当天的成就 > 高光事件 > 花时间最多的事；同一个主角在一周里重复会被降权，七天尽量不一样；
   4. 主角决定这一天的一切：色调、天空里的主题元素、进场的大块转场、心情特效、数据面板用哪种形式。
   都只用真实数据；没有对应意象的事退回到最接近的类型。 */
window.WR_LEAD = (function () {
  const cl01 = v => Math.max(0, Math.min(1, v));
  const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const W = "rgba(255,255,255,.92)", LINE = "rgba(22,24,29,.18)";

  /* 意象类型：主色、浅色、进场转场的形状 */
  const TYPES = {
    lab: { name: "实验", da: "#12A08A", dt: "#CFF1E8", mask: "wave" },
    exam: { name: "考试", da: "#3D6BF2", dt: "#DAE5FD", mask: "diag" },
    book: { name: "读书", da: "#D29200", dt: "#FFEFC2", mask: "page" },
    code: { name: "写代码", da: "#4F5BD5", dt: "#E0E3FB", mask: "bars" },
    run: { name: "跑步", da: "#FF6B4A", dt: "#FFE0D6", mask: "lanes" },
    swim: { name: "游泳", da: "#1E9BD7", dt: "#D3EDFA", mask: "wave" },
    gym: { name: "力量", da: "#E5484D", dt: "#FFDFDE", mask: "lanes" },
    ball: { name: "球", da: "#F08C2E", dt: "#FFE8D1", mask: "circle" },
    music: { name: "音乐", da: "#8B5CF6", dt: "#EAE2FF", mask: "bars" },
    social: { name: "见面", da: "#E5609A", dt: "#FCE0EC", mask: "circle" },
    heart: { name: "放松", da: "#E5609A", dt: "#FCE0EC", mask: "circle" },
    sleep: { name: "休息", da: "#7C6CD8", dt: "#E5E0FA", mask: "page" },
    rain: { name: "低落", da: "#5B6F9E", dt: "#D9E0EE", mask: "drip" }
  };
  const typeOfText = (t, i = "", cat = "") => {
    if (i === "code" || /代码|编程|python|黑客松|code|测试|bug|函数/i.test(t)) return "code";   // 先认代码：「写测试」「生物信息黑客松」不是考试、不是实验
    if (/考|小测|测验|期中|期末|exam|订正|试卷/i.test(t)) return "exam";
    if (i === "lab" || /实验|化学|有机|细胞|生化|生物|lab/i.test(t)) return "lab";
    if (i === "run" || /跑/.test(t)) return "run";
    if (i === "swim" || /游泳/.test(t)) return "swim";
    if (i === "gym" || /力量|健身|卧推|练腿|练背|练胸/.test(t)) return "gym";
    if (i === "ball" || /球/.test(t)) return "ball";
    if (i === "music" || i === "sing" || /排练|乐队|唱|琴|吉他|演出|音乐|专场|首演|原创|节拍|bpm|贝斯/i.test(t)) return "music";
    if (i === "meet" || /队友|朋友|聚|开会|开幕|路演|颁奖/.test(t)) return "social";
    if (i === "heart" || /电影|视频|家|奶奶|室友/.test(t)) return "heart";
    if (i === "book" || /读|英语|单词|文献|笔记|总结|章/.test(t)) return "book";
    if (i === "pen") return "exam";
    if (!cat) return null;   // 只有文字、认不出来（比如成就的标题）：不猜
    return cat === "sport" ? "run" : cat === "study" ? "book" : cat === "sleep" ? "sleep" : "heart";
  };
  const typeOf = e => typeOfText(e.text || "", e.icon || "", e.cat);

  /* 心情：分数 + 原话里的词 */
  function feelOf(md) {
    if (!md) return "calm";
    const q = (md.quote || "") + " " + (md.reading || ""), lv = md.level;
    if (lv != null && lv <= 2) return /慌|紧张|担心|怕|急/.test(md.quote || "") ? "anxious" : /累|困|阈值|吃不下|好紧/.test(md.quote || "") ? "tired" : "sad";
    if (lv >= 5 || /！！|!!/.test(md.quote || "")) return "excited";
    if (lv === 4) return "happy";
    if (/累|困|阈值/.test(q)) return "tired";
    return "calm";
  }
  const FEEL = { anxious: "焦虑", tired: "疲惫", sad: "低落", excited: "兴奋", happy: "开心", calm: "平静" };

  /* 一周一起分析：每天的主角、心情、数据面板 */
  function analyzeWeek(c, D, dayOf) {
    const A = c.data.achievements || [], used = {}, panelsUsed = new Set();
    return D.map(x => {
      const w = {}, add = (k, v) => w[k] = (w[k] || 0) + v;
      x.acts.forEach(e => add(typeOf(e), (c.mins(e.end) - c.mins(e.start)) * (e.cat === "star" ? 8 : e.cat === "sport" ? 2 : 1)));
      A.filter(a => dayOf(a.when) === x.i).forEach(a => { const k = typeOfText(`${a.what} ${a.big}`); if (k) add(k, 2000); });
      const feel = feelOf(x.mood);
      if (x.mood?.level != null && x.mood.level <= 2) add("rain", 3000);   // 只有分数真的低才下雨；3 分的「累」只让天色变暗
      Object.keys(w).forEach(k => { if (k !== "rain") w[k] *= Math.pow(.45, used[k] || 0); });
      const sig = Object.keys(w).sort((a, b) => w[b] - w[a])[0] || "heart";
      used[sig] = (used[sig] || 0) + 1;
      const types = [...new Set(x.acts.map(typeOf))];
      const subjects = [...new Set(x.acts.filter(e => e.cat === "study").map(e => String(e.text).split(/[ ·]/)[0]))];
      const hasExam = x.acts.some(e => e.cat === "star" && typeOf(e) === "exam") || A.some(a => dayOf(a.when) === x.i && typeOfText(a.what) === "exam");
      const pref = [hasExam && "gauge", (feel === "anxious" || feel === "sad") && "dots", x.acts.some(e => e.cat === "sport") && "compare", subjects.length >= 2 && "subjects",
        "clock", "ribbon", "ring", "dots", "subjects", "compare", "gauge"].filter(Boolean);
      const panel = pref.find(p => !panelsUsed.has(p)) || "ring"; panelsUsed.add(panel);
      return { ...TYPES[sig], sig, feel, feelName: FEEL[feel], types, subjects, panel };
    });
  }

  /* ---------- 天空里的活动小场景（地面 y=0，往上画） ---------- */
  const V = {
    lab: da => `<rect x="-78" y="-12" width="86" height="7" rx="3.5" fill="${W}"/>`
      + ["#7FD8C6", "#F5B9A6", "#EFD46A"].map((col, k) => `<g class="vt" data-x="${-62 + k * 22}" transform="translate(${-62 + k * 22} -6)"><rect x="-7.5" y="-60" width="15" height="58" rx="7.5" fill="${W}" stroke="${LINE}"/><rect class="vl" x="-5.5" y="-30" width="11" height="27" rx="5.5" fill="${col}"/></g>`).join("")
      + `<g class="vf" transform="translate(44 0)"><path d="M-10 -86 h20 v28 l27 44 a9 9 0 0 1 -8 14 h-58 a9 9 0 0 1 -8 -14 l27 -44z" fill="${W}" stroke="${LINE}"/><path class="vfl" d="M-29 -16 l11 -19 h36 l11 19 a7 7 0 0 1 -6 11 h-46 a7 7 0 0 1 -6 -11z" fill="${da}" opacity=".85"/></g>`
      + [...Array(7)].map((_, k) => `<circle class="vb" cx="${36 + (k % 3) * 8}" cy="-30" r="${2.5 + (k % 3)}" fill="#fff" stroke="${da}" stroke-width="1.2"/>`).join(""),
    exam: da => `<g transform="rotate(-6)"><rect x="-58" y="-104" width="96" height="100" rx="8" fill="${W}" stroke="${LINE}"/>`
      + [0, 1, 2, 3].map(k => `<path class="vw" d="M-46 ${-84 + k * 18} q7 -7 14 0 t14 0 t14 0 t14 0 t14 0" fill="none" stroke="${da}" stroke-width="2.4" stroke-linecap="round"/>`).join("")
      + `<path class="vchk" d="M8 -40 l12 12 l26 -32" fill="none" stroke="#E5484D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>`
      + `<g class="vpen"><rect x="-4" y="-46" width="8" height="40" rx="2" fill="${da}"/><path d="M-4 -6 l4 9 l4 -9z" fill="#3A3A3A"/><rect x="-4" y="-50" width="8" height="6" rx="2" fill="#F5B9A6"/></g>`,
    book: da => `<g transform="translate(-10 -10)"><path d="M0 -6 C -22 -14 -44 -14 -64 -6 V -76 C -44 -84 -22 -84 0 -76z" fill="${W}" stroke="${LINE}"/><path d="M0 -6 C 22 -14 44 -14 64 -6 V -76 C 44 -84 22 -84 0 -76z" fill="${W}" stroke="${LINE}"/>`
      + [0, 1, 2].map(k => `<path d="M-54 ${-62 + k * 14} h40 M14 ${-62 + k * 14} h40" stroke="${da}" stroke-opacity=".5" stroke-width="2.5" stroke-linecap="round"/>`).join("")
      + `<path class="vpg" d="M0 -6 C 22 -14 44 -14 64 -6 V -76 C 44 -84 22 -84 0 -76z" fill="${da}" fill-opacity=".22" stroke="${da}"/></g>`,
    code: da => `<rect x="-60" y="-92" width="120" height="76" rx="8" fill="#232634"/><rect x="-72" y="-16" width="144" height="10" rx="5" fill="${W}" stroke="${LINE}"/>`
      + [...Array(5)].map((_, k) => `<rect class="vcl" x="${-50 + (k % 2) * 10}" y="${-82 + k * 12}" width="${44 + (k * 23) % 50}" height="6" rx="3" fill="${["#7FD8C6", "#C9BCEF", da, "#EFD46A", "#F5B9A6"][k]}"/>`).join("")
      + `<rect class="vcur" x="10" y="-34" width="7" height="10" fill="#fff"/>`,
    run: da => { const L = (x1, y1, x2, y2, w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${da}" stroke-width="${w}" stroke-linecap="round"/>`;
      const limb = (cls, x, y, len1, len2, w) => `<g class="${cls}">${L(x, y, x, y + len1, w)}<g class="${cls}b">${L(x, y + len1, x, y + len1 + len2, w - .5)}</g></g>`;
      return `<path d="M-90 2 H 110" stroke="${da}" stroke-opacity=".3" stroke-width="5" stroke-dasharray="14 10" class="vtrack"/>`
        + `<g class="vrun"><g class="vbob">${limb("rl2", 0, -36, 17, 17, 6.5)}${limb("ra2", 4, -60, 11, 11, 5)}`
        + `<g transform="rotate(14 0 -36)">${L(0, -36, 0, -62, 7.5)}<circle cx="0" cy="-73" r="8" fill="${da}"/></g>`

  /* 活动小场景的循环动画（GSAP，暂停着建，主角那天的场景固定住时才播） */

      const run = q(".vrun")[0], ph = { v: 0 }, R = (sel, a, cx, cy) => q(sel).forEach(n => n.setAttribute("transform", `rotate(${a.toFixed(1)} ${cx} ${cy})`));
      const pose = () => { const t = ph.v * Math.PI * 2;
        [[1, 0], [2, Math.PI]].forEach(([k, o]) => { const s1 = Math.sin(t + o), c1 = Math.cos(t + o);
          R(`.rl${k}`, -34 * s1, 0, -36); R(`.rl${k}b`, 14 + 62 * Math.max(0, c1) * (s1 < .3 ? 1 : .5), 0, -19);

  /* 心情特效层（天空里） */
  function fxLayer(info, R) {

    if (info.feel === "happy") return sp(9);
    if (info.feel === "anxious") return [0, 1].map(k => `<path class="fx-bolt" d="M${120 + k * 150} 60 l-16 46 h18 l-12 44 l34 -58 h-18 l14 -32z" fill="#FFE27A" stroke="#F0C33C" opacity="0"/>`).join("");
    if (info.feel === "tired") return `<rect class="fx-dim" x="0" y="0" width="400" height="330" fill="#4B5068" opacity=".12"/>`;

  function quoteAnim(chars, feel, gsap) {

  const BIG = {

  /* 所有边缘都是平滑曲线：两层（色带 + 新的一天）错开时才是一条干净的色带，不会叠成格子 */
  const R0 = rng(42), DROPS = [...Array(7)].map(() => ({ x: 6 + R0() * 88, d: 8 + R0() * 16, w: 3 + R0() * 4 }));
  function mask(kind, p) {
    const f = v => v.toFixed(2) + "%", c = v => Math.max(0, Math.min(100, v)), pts = [];
    if (kind === "circle") return { clip: `circle(${(p * 150).toFixed(1)}% at 78% 22%)`, el: [78, 22, p] };
    if (kind === "wave" || kind === "bars") {        // 液面 / 声波：从下往上涨，声波的起伏更大更快
      const A = kind === "bars" ? 7 : 5, F = kind === "bars" ? .1 : .09, y0 = 100 - p * (100 + A * 3);
      const y = x => y0 + A * Math.sin(x * F + p * 10) + (kind === "bars" ? A * .35 * Math.sin(x * F * 1.7 - p * 6) : 0);
      for (let x = 0; x <= 100; x += 2) pts.push(`${x}% ${f(c(y(x)))}`);
      return { clip: `polygon(${pts.join(",")},100% 100%,0% 100%)`, el: [kind === "bars" ? 50 : 62, y(kind === "bars" ? 50 : 62), 1] };
    }
    if (kind === "drip") {                           // 雨帘：从上往下落，边缘挂着几颗圆润的水滴
      const base = p * 125, y = x => base - 6 + 3 * Math.sin(x * .12 + p * 6) + DROPS.reduce((a, d) => a + d.d * Math.exp(-Math.pow((x - d.x) / d.w, 2)), 0);
      pts.push("0% 0%", "100% 0%"); for (let x = 100; x >= 0; x -= 2) pts.push(`${x}% ${f(c(y(x)))}`);
      return { clip: `polygon(${pts.join(",")})`, el: [DROPS[2].x, y(DROPS[2].x), 1] };
    }

    const rain = n => [...Array(n)].map((_, k) => `<line x1="${14 + k * 6}" y1="33" x2="${12 + k * 6}" y2="38" stroke="#8FA8E0" stroke-width="2" stroke-linecap="round"/>`).join("");
    const inner = level === 5 ? sun(20, 20, 8) : level === 4 ? sun(14, 14, 6) + cloud("#fff", "#C9CCD8") : level === 3 ? cloud("#fff", "#B9BECB")
      : level === 2 ? cloud("#E4E6EE", "#B0B6C6") + rain(3) : level === 1 ? cloud("#C9CEDB", "#9CA3B5") + rain(3) + `<path d="M22 24l-4 7h4l-2 6 6-9h-4l2-4z" fill="var(--c-star)"/>`
      : cloud("#fff", "#C9CCD8") + `<text x="20" y="27" text-anchor="middle" font-size="9" fill="#8E93A0">?</text>`;
    return `<svg viewBox="0 0 40 40" aria-hidden="true">${inner}</svg>`;
  }

  function days(c) {
    const TL = c.data.timeline || [], st = c.data.core.find(x => x.key === "study"), sl = c.data.core.find(x => x.key === "sleep");
    return c.DAYS.map((d, i) => {
      const ev = TL.filter(e => e.day === i);
      const wakeP = ev.filter(e => e.cat === "sleep" && c.mins(e.end) <= 720 && c.mins(e.end) > 0 && e.end !== "24:00");
      const wake = wakeP.length ? Math.max(...wakeP.map(e => c.mins(e.end))) : null;
      const bed = ev.filter(e => e.cat === "sleep" && c.mins(e.start) >= 1200).map(e => c.mins(e.start))[0] ?? null;
      const acts = ev.filter(e => e.cat !== "sleep").sort((a, b) => c.mins(a.start) - c.mins(b.start));
      const t0 = wake ?? (acts.length ? c.mins(acts[0].start) - 30 : 480);
      const t1 = Math.min(1439, Math.max(bed ?? 0, acts.length ? c.mins(acts.at(-1).end) + 60 : t0 + 600, 1290));
      return { i, d, acts, wake, bed, t0, t1, study: st?.daily?.[i] ?? null, sleep: sl?.daily?.[i] ?? null,
        tonight: sl?.daily?.[i + 1] ?? null, mood: c.data.mood?.days?.[i] };
    });
  }

  /* 学习的书：按时间顺序把学习事件切成一小时一本 */
  function books(c) {
    const TL = (c.data.timeline || []).filter(e => e.cat === "study").sort((a, b) => a.day - b.day || c.mins(a.start) - c.mins(b.start));
    const subj = [], list = []; let cum = 0;
    TL.forEach(e => { const h = (c.mins(e.end) - c.mins(e.start)) / 60, s = String(e.text).split(/[ ·]/)[0];
      if (!subj.includes(s)) subj.push(s);
      const from = Math.floor(cum + 1e-6); cum += h; const to = Math.floor(cum + 1e-6);
      for (let k = from; k < to; k++) list.push({ e, col: BOOK[subj.indexOf(s) % BOOK.length] }); });
    return list;
  }

  /* 每个小时在做什么：按重叠分钟最多的类别 */
  function hours(c) {
    const TL = c.data.timeline || [];
    return c.DAYS.map((_, d) => [...Array(24)].map((_, h) => {
      let best = null, bm = 0;
      TL.filter(e => e.day === d).forEach(e => { const ov = Math.max(0, Math.min(c.mins(e.end), h * 60 + 60) - Math.max(c.mins(e.start), h * 60)); if (ov > bm) { bm = ov; best = e; } });
      return best && bm >= 20 ? best : null;
    }));
  }

  function stage(c, x, bk, info) {
    const L = window.WR_LEAD;
    const R = rng(x.i * 97 + 13), lv = x.mood?.level ?? null;
    const nStars = x.tonight != null ? Math.round(x.tonight) : 0;
    const stars = [...Array(nStars)].map(() => `<circle class="sky-star" cx="${(30 + R() * 340).toFixed(1)}" cy="${(16 + R() * 120).toFixed(1)}" r="${(1.2 + R() * 1.6).toFixed(1)}" style="animation-delay:${(R() * 2).toFixed(2)}s"/>`).join("");
    const nCloud = lv == null ? 1 : { 5: 0, 4: 1, 3: 2, 2: 3, 1: 4 }[lv];
    const cfill = lv === 2 ? "#E4E6EE" : lv === 1 ? "#CBCFDB" : "#fff";
    const clouds = [...Array(nCloud)].map((_, k) => `<path class="sky-cloud" data-b="${(60 + k * 115 + R() * 40).toFixed(0)}" data-y="${(70 + R() * 60).toFixed(0)}" data-s="${(1.3 + R() * .7).toFixed(2)}" d="${CLOUD}" style="fill:${cfill}"/>`).join("");
    const rays = [...Array(12)].map((_, k) => { const a = k * Math.PI / 6; return `<line x1="${Math.cos(a) * 62}" y1="${Math.sin(a) * 62}" x2="${Math.cos(a) * 76}" y2="${Math.sin(a) * 76}"/>`; }).join("");
    const bks = bk.map((b, k) => { const step = Math.min(10, 236 / Math.max(bk.length, 1)), bx = 306 + (rng(k * 7 + 3)() - .5) * 12, by = 266 - (k + 1) * step, bw = 64 + (rng(k * 5 + 1)() - .5) * 10;
      return `<g class="sky-book" data-k="${k}" opacity="0"><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${(step - 1).toFixed(1)}" rx="2" fill="${b.col}"/>`
        + `<rect x="${(bx + 4).toFixed(1)}" y="${(by + 2).toFixed(1)}" width="${(bw * .3).toFixed(1)}" height="${(step * .4).toFixed(1)}" rx="1" fill="#fff" opacity=".6"/><rect x="${(bx + bw - 7).toFixed(1)}" y="${by.toFixed(1)}" width="2.5" height="${(step - 1).toFixed(1)}" fill="rgba(22,24,29,.14)"/></g>`; }).join("");
    return `<div class="cl-stage" data-lv="${lv ?? ""}"><svg viewBox="0 0 400 330" preserveAspectRatio="xMidYMid meet" role="img" aria-label="周${x.d}的天空">
        <g class="sky-stars">${stars}</g>
        <g class="sky-moon"><circle r="44" fill="var(--moon)" opacity=".25"/><circle r="26" fill="var(--moon)"/><circle class="sky-shadow" r="26"/><text y="46" text-anchor="middle" font-size="10" fill="var(--ink2)">${x.tonight != null ? `今晚睡 ${c.hm(x.tonight)}` : "今晚的觉下周记"}</text></g>
        <g class="sky-sun"><circle r="56" fill="var(--sun)" opacity=".18"/><circle r="42" fill="var(--sun)" opacity=".28"/><g class="sky-rays" style="display:${lv >= 4 ? "inline" : "none"}">${rays}</g><circle r="31" fill="var(--sun)"/></g>
        <g class="sky-clouds">${clouds}</g><g class="fx">${L.fxLayer(info, R)}</g>
        <path d="M0 236 C 60 206, 130 214, 190 230 S 320 196, 400 222 L400 330 L0 330Z" fill="var(--hill1)"/>
        <path d="M0 268 C 70 248, 150 262, 230 256 S 350 250, 400 262 L400 330 L0 330Z" fill="var(--hill2)"/>

        <g class="sky-books">${bks}</g><text class="sky-btext" x="338" y="250" text-anchor="middle" font-size="12" font-weight="800" fill="var(--accent)"></text>
        <path class="sky-ecg" d=""/><text class="sky-etext" x="16" y="296" font-size="10" fill="var(--ink2)"></text>
      </svg>${lv != null && lv <= 2 ? `<canvas class="sky-rain"></canvas>` : ""}
      <div class="cl-dhead"><span class="cl-dn">周${x.d}</span><span class="cl-dd">${(() => { const t = new Date(c.data.meta.start + "T00:00:00"); t.setDate(t.getDate() + x.i); return `${t.getMonth() + 1} 月 ${t.getDate()} 日`; })()}</span><span class="cl-lead-tag" style="color:${info.da}">今天的主角：${info.name} · 心情${info.feelName}</span></div>
      ${x.i === 0 ? `<span class="cl-hint">拖动太阳 · 点书 · 点云</span>` : ""}<div class="cl-tip" aria-live="polite"></div></div>`;
  }

  /* ---------- 总结区：大环图、进度环、可滑的原话卡、可翻的复盘卡、逐句亮起的信、极光底 ---------- */
  function summary(c, live, gsap, ST, INFO) {
    const $ = c.$, $$ = c.$$, cols = [...new Set(INFO.map(i => i.da))];
    /* 极光：用这一周几个主角的颜色 */
    document.body.insertAdjacentHTML("beforeend", `<div class="cl-aurora" aria-hidden="true">${cols.slice(0, 4).map((col, k) => `<i style="width:${280 + k * 40}px;height:${280 + k * 40}px;background:${col};left:${[-10, 55, 10, 60][k]}%;top:${[5, 25, 55, 70][k]}%"></i>`).join("")}</div>`);
    const aur = $(".cl-aurora"), first = $(".wr-sec");
    if (live && first) { ST.create({ trigger: first, start: "top 85%", onEnter: () => aur.classList.add("on"), onLeaveBack: () => aur.classList.remove("on") });
      $$(".cl-aurora i").forEach((b, k) => gsap.to(b, { x: k % 2 ? 60 : -60, y: k % 2 ? -40 : 50, scale: 1.15, duration: 7 + k * 2, yoyo: true, repeat: -1, ease: "sine.inOut" })); }
    else if (first) aur.classList.add("on");

    const sp = $("#wr-split");
    if (sp) { const rows = $$(".wr-li", sp).map(li => ({ li, k: li.dataset.k, n: li.children[1].textContent, h: li.children[2].textContent, p: parseFloat(li.children[3].textContent) }));
      const R = 72, C = 2 * Math.PI * R; let off = 0;
      const segs = rows.map(r => { const len = r.p / 100 * C, g = `<circle class="seg" data-k="${r.k}" r="${R}" cx="100" cy="100" fill="none" stroke="var(--c-${r.k === "none" ? "none" : r.k})" stroke-width="30" stroke-dasharray="${Math.max(0, len - 2).toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 100 100)"/>`; off += len; return g; }).join("");
      $(".wr-stack", sp).insertAdjacentHTML("beforebegin", `<div class="cl-donut"><svg viewBox="0 0 200 200">${segs}<g class="ctr"><text x="100" y="94" text-anchor="middle" font-size="13" fill="var(--ink2)">一周</text><text x="100" y="120" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">168h</text></g></svg><div class="cl-dleg"></div></div>`);
      $(".wr-stack", sp).style.display = "none"; $(".cl-dleg", sp).appendChild($(".wr-legend", sp));
      const ctr = $$(".ctr text", sp), pick = k => { $$(".seg", sp).forEach(q => q.classList.toggle("dim", q.dataset.k !== k)); const r = rows.find(q => q.k === k); if (!r) return; ctr[0].textContent = r.n; ctr[1].textContent = r.h; };
      $$(".seg", sp).forEach(g => g.addEventListener("click", () => { const r = rows.find(q => q.k === g.dataset.k); r.li.click(); pick(g.dataset.k); }));
      rows.forEach(r => r.li.addEventListener("click", () => pick(r.k)));
      if (live) gsap.from($$(".seg", sp), { strokeDasharray: `0 ${C}`, duration: 1.2, stagger: .12, ease: "power3.out", scrollTrigger: { trigger: sp, start: "top 70%" } }); }

    /* 目标：进度环卡片 */
    $$(".wr-s-goals .wr-g").forEach(g => { const bar = $(".wr-g-bar i", g), pr = bar ? parseFloat(bar.style.getPropertyValue("--p")) : (g.dataset.s === "done" ? 1 : 0);
      const col = g.dataset.s === "done" ? "var(--accent)" : g.dataset.s === "missed" ? "#C9CEDB" : "var(--c-study)";
      $(".wr-g-top", g).insertAdjacentHTML("afterbegin", `<span class="cl-gwrap"><i class="cl-gring" style="--p:${pr};--gc:${col}"></i><b>${Math.round(pr * 100)}%</b></span>`);
      if (live) { const num = $(".cl-gwrap b", g), o = { p: 0 };
        /* 环和数字用同一个补间画：直接补间 CSS 变量时 GSAP 读不到终点，环会一直停在 0 */
        const ring = $(".cl-gring", g); ring.style.setProperty("--p", 0); num.textContent = "0%";
        gsap.to(o, { p: pr, duration: 1.4, ease: "power3.out", onUpdate: () => { ring.style.setProperty("--p", o.p.toFixed(4)); num.textContent = Math.round(o.p * 100) + "%"; }, scrollTrigger: { trigger: g, start: "top 85%" } }); } });

    /* 原话：左右滑的彩色卡 */
    const qs = $("#wr-quotes"), Q = c.data.quotes || [];
    if (qs && Q.length) { const dts = INFO.map(i => i.dt);
      $$(".wr-qcard", qs).forEach((cd, k) => { cd.style.setProperty("--qmark", cols[k % cols.length]); cd.style.setProperty("--q2", dts[(k * 2 + 1) % dts.length]); }); }

    /* 复盘：一叠卡，点最上面那张它就飞到最后 */
    const rv = $("#wr-review");
    if (rv) { $(".wr-tabs", rv).insertAdjacentHTML("afterend", `<div class="cl-stack"></div>`);
      const stack = $(".cl-stack", rv);
      const layout = anim => $$(".cl-scard", stack).forEach((cd, i, all) => { const v = { y: i * 12, scale: 1 - i * .05, zIndex: all.length - i, opacity: i > 2 ? 0 : 1 - i * .18 };
        if (anim && live) gsap.to(cd, { ...v, duration: .5, ease: "power3.out" }); else Object.assign(cd.style, { transform: `translateY(${v.y}px) scale(${v.scale})`, zIndex: v.zIndex, opacity: v.opacity }); });
      const build = () => { const items = $$(".wr-rlist li", rv).map(li => li.textContent), k = $(".wr-rlist", rv).dataset.k;
        stack.innerHTML = items.map((t, i) => `<div class="cl-scard"><em>${String(i + 1).padStart(2, "0")}</em>${c.esc(t)}<small>${i + 1}/${items.length} · 点一下翻到下一张</small></div>`).join("");
        stack.style.height = 150 + Math.min(items.length, 3) * 12 + 30 + "px"; layout(false);
        if (live) gsap.from($$(".cl-scard", stack), { y: 60, opacity: 0, duration: .6, stagger: .08, ease: "expo.out" }); };
      stack.addEventListener("click", () => { const top = stack.firstElementChild; if (!top || stack.children.length < 2) return;
        if (live) gsap.to(top, { y: -90, rotation: -8, opacity: 0, duration: .35, ease: "power2.in", onComplete: () => { stack.appendChild(top); gsap.set(top, { rotation: 0 }); layout(true); } });
        else { stack.appendChild(top); layout(false); } });
      $$(".wr-tab", rv).forEach(t => t.addEventListener("click", () => setTimeout(build, 0))); build(); }

    /* 信：往下滑，一句一句亮起来，最后画一笔签名 */
    const lt = $(".wr-letter");
    if (lt) { lt.insertAdjacentHTML("beforeend", `<svg class="cl-sign" viewBox="0 0 120 44"><path d="M6 30 C 20 6, 30 40, 44 22 S 64 10, 70 28 S 92 36, 114 14" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>`);
      if (live) { $$("p", lt).forEach(pp => gsap.fromTo(pp, { opacity: .15 }, { opacity: 1, ease: "none", scrollTrigger: { trigger: pp, start: "top 85%", end: "top 55%", scrub: true } }));
        const path = $(".cl-sign path", lt); gsap.fromTo(path, { strokeDasharray: 200, strokeDashoffset: 200 }, { strokeDashoffset: 0, duration: 1.4, ease: "power2.inOut", scrollTrigger: { trigger: lt, start: "bottom 90%" } }); } }
  }

  /* 彩纸 */
  let confetti = null;
  function burst(x, y, n = 110) {
    if (!confetti) { const cv = document.createElement("canvas"); cv.className = "cl-confetti"; document.body.appendChild(cv); confetti = { cv, ctx: cv.getContext("2d"), ps: [], run: false }; }
    const C = confetti, dpr = Math.min(2, devicePixelRatio || 1); C.cv.width = innerWidth * dpr; C.cv.height = innerHeight * dpr; C.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cols = ["#8FB2F2", "#C9BCEF", "#8DD9BF", "#F5B9A6", "#EFD46A", "#3D6BF2"];
    for (let k = 0; k < n; k++) { const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = 6 + Math.random() * 8;
      C.ps.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 6, vr: (Math.random() - .5) * .4, w: 5 + Math.random() * 5, h: 8 + Math.random() * 6, c: cols[k % cols.length], life: 0 }); }
    if (C.run) return; C.run = true;
    (function step() {
      const g = C.ctx; g.clearRect(0, 0, innerWidth, innerHeight);
      C.ps = C.ps.filter(p => p.life < 150 && p.y < innerHeight + 40);
      C.ps.forEach(p => { p.life++; p.vy += .28; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = cl01(1.6 - p.life / 95); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.h / 2, p.w, Math.abs(Math.cos(p.r * 2)) * p.h + 1); g.restore(); });
      if (C.ps.length) requestAnimationFrame(step); else { C.run = false; g.clearRect(0, 0, innerWidth, innerHeight); }
    })();
  }

  return {
    modules: ["split", "goals", "quotes", "review", "letter"],
    splitStyle: "custom", letterScrub: true,   // 大环图和信的滚动亮起，这个主题自己做   // 三个核心数在收拢场景，7×24 在开场，不再重复
    labels: {
      split: { title: "168 小时去了哪里", hint: "点一类，看它在七天里的分布" },
      goals: { title: "目标对账", hint: "先看做成的，再看差在哪" },
      quotes: { title: "值得记住的话", hint: "左右滑，下一句" },
      review: { title: "复盘", hint: "" },
      letter: { title: "写给这一周", hint: "" }
    },

    cover(c) {
      const m = c.data.meta, HR = hours(c);
      const cells = HR.flatMap((row, d) => row.map((e, h) => `<i class="cl-cell" data-d="${d}" data-h="${h}" style="--c:var(--c-${e ? e.cat : "none"})"></i>`)).join("");
      const key = [["study", "学习"], ["sport", "运动"], ["life", "个人"], ["star", "高光"], ["sleep", "睡眠"], ["none", "没记录"]].map(([k, n]) => `<span><i style="background:var(--c-${k})"></i>${n}</span>`).join("");
      return `<header class="cl-intro"><div class="cl-ipin">
        <div class="cl-kick"><b>第 ${m.week} 周</b> · ${c.esc(m.name || m.title)} · ${m.start.slice(5).replace("-", ".")} — ${m.end.slice(5).replace("-", ".")}</div>
        <div class="cl-cells" role="img" aria-label="这一周的 168 个小时">${cells}
          <div class="cl-gdays" aria-hidden="true">${c.DAYS.map(d => `<span>${d}</span>`).join("")}</div>
          <div class="cl-gaxis" aria-hidden="true"><span>0</span><span>6</span><span>12</span><span>18</span><span>24</span></div></div>
        <div class="cl-leads"><p class="cl-lead l1">一周有 <b>168</b> 个小时。往下滑，把它们再过一遍。</p>
          <p class="cl-lead l2" style="opacity:0">这是你这一周的 168 个小时<span class="cl-read" style="display:block">手指在格子上拖，看任何一小时</span></p></div>
        <div class="cl-key">${key}</div><i class="cl-down" aria-hidden="true"></i></div></header>`;
    },

    story(c) {
      const D = days(c), reader = c.data.meta.reader || "助手", A = c.data.achievements || [], BK = books(c), L = window.WR_LEAD, INFO = L.analyzeWeek(c, D, dayOf);
      const st = c.data.core.find(x => x.key === "study");
      const placed = A.map(a => dayOf(a.when));
      const achHtml = (a, k) => {
        const big = [...String(a.big)].map(ch => /\d/.test(ch) ? `<span class="cl-slot" data-n="${ch}"><span class="cl-reel">${[..."0123456789012345678"].map(d => `<span>${d}</span>`).join("")}<span>${ch}</span></span></span>`
          : `<span class="cl-ch">${ch === " " ? "&nbsp;" : c.esc(ch)}</span>`).join("");
        return `<section class="cl-ach" data-tint="${TINTS[k % TINTS.length]}"><div class="cl-acard" style="--tint:var(--t-${TINTS[k % TINTS.length]})"><i class="cl-glare" aria-hidden="true"></i>
          <span class="cl-atag">${c.esc(a.when || "")} · 本周成就 ${k + 1}/${A.length}</span><span class="cl-tiltme" aria-hidden="true">拖动卡片 ↻</span>
          <div class="cl-abig" aria-label="${c.esc(a.big)}">${big}</div><div class="cl-awhat">${c.esc(a.what)}</div>
          ${a.figure ? `<figure class="cl-afig">${a.figure}</figure>` : ""}
          ${a.detail ? `<p class="cl-adetail">${c.esc(a.detail)}</p>` : ""}${a.say ? `<p class="cl-asay">${c.esc(a.say)}</p>` : ""}</div></section>`;
      };
      let html = "";
      D.forEach(x => {
        const info = INFO[x.i], rows = [];
        if (x.wake != null) rows.push(`<li class="cl-ev" data-c="sleep" data-s="${x.wake}" data-e="${x.wake + 20}"><time>${c.clock(x.wake)}</time><i>${c.icon("sleep")}</i><span>醒来${x.sleep != null ? ` · 睡了 ${c.hm(x.sleep)}` : ""}</span><b></b></li>`);
        x.acts.forEach(e => { const s = c.mins(e.start), en = c.mins(e.end);
          rows.push(`<li class="cl-ev" data-c="${e.cat}" data-s="${s}" data-e="${en}"><time>${e.start}</time><i>${c.icon(e.icon || e.cat)}</i><span>${c.esc(e.text)}</span><b>${c.hm((en - s) / 60)}</b></li>`); });

  /* 成就 */

  /* 时间线：按住拖动，看任何一刻 */

  /* 专注时段：7×24，学习和高光按小时累计 */
